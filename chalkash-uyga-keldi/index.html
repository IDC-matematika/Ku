<title>Chalkash uyga keldi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: workbook app — page index with stars on the left, the activity sheet (always paper-white) in the centre,
   a side column with the bonus question and the parent tip; one column with a bottom bar on phones. */
:root{
  --bg:#F3F2ED;
  --surface:#FFFFFF;
  --surface-2:#ECEBE4;
  --fg:#1D2220;
  --muted:#626964;
  --hair:#E1DFD6;
  --accent:#E5505A;
  --accent-fg:#FFFFFF;
  --accent-soft:#FCE7E8;
  --good:#2C7D4E;
  --good-soft:#E2F1E7;
  --star:#F2A81E;
  --ring:#F2922E;
  --shadow:0 1px 2px rgba(30,34,32,.06),0 8px 24px -12px rgba(30,34,32,.18);
  --ui:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --head:'Unbounded','Onest',system-ui,sans-serif;
  --read:'Andika','Onest',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111413;--surface:#1A1E1C;--surface-2:#232826;--fg:#E8ECE9;--muted:#9AA39E;--hair:#2C322F;
  --accent:#FF6C75;--accent-fg:#1B0B0D;--accent-soft:#3A2326;--good:#71CC93;--good-soft:#1C3125;--star:#F7B940;--ring:#F5A452;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111413;--surface:#1A1E1C;--surface-2:#232826;--fg:#E8ECE9;--muted:#9AA39E;--hair:#2C322F;
  --accent:#FF6C75;--accent-fg:#1B0B0D;--accent-soft:#3A2326;--good:#71CC93;--good-soft:#1C3125;--star:#F7B940;--ring:#F5A452;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block;user-select:none;-webkit-user-drag:none}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.ico svg{width:100%;height:100%;display:block}

.app{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;max-width:1500px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}

/* index */
.nav{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--hair);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.brand{display:flex;gap:12px;align-items:center;padding:16px 16px 12px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:1.2rem;flex:0 0 auto}
.eyebrow{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bt{font-family:var(--head);font-weight:700;font-size:1.05rem;line-height:1.2}
.prog{margin:0 16px 12px;padding:12px;border-radius:14px;background:var(--surface-2);display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.prog .ico{width:30px;height:30px;color:var(--star);grid-row:span 2}
.prog .pc{font-family:var(--head);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.prog .pl{font-size:.8rem;color:var(--muted)}
.pbar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--hair);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--star);border-radius:4px;transition:width .5s}
.navlist{list-style:none;margin:0;padding:6px 8px;overflow:auto;flex:1;border-top:1px solid var(--hair)}
.ni{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) 20px;gap:10px;align-items:center;text-align:left;border:0;background:transparent;border-radius:12px;padding:7px 8px}
.ni:hover{background:var(--surface-2)}
.ni[aria-current="true"]{background:var(--accent-soft)}
.ni .n{font-family:var(--head);font-weight:700;font-size:.85rem;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);font-variant-numeric:tabular-nums}
.ni[aria-current="true"] .n{background:var(--accent);color:var(--accent-fg)}
.ni .nt{font-weight:600;font-size:.92rem;line-height:1.2;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .ns{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:5px}
.ni .ns i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.ni .st{width:20px;height:20px;color:var(--hair)}
.ni.done .st{color:var(--star)}
.navfoot{padding:10px 16px 14px;border-top:1px solid var(--hair)}
.linkbtn{border:0;background:none;padding:4px 0;color:var(--muted);font-size:.82rem;text-decoration:underline;text-underline-offset:3px}
.linkbtn.warn{color:var(--accent);font-weight:700}

/* main */
.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.ph{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--hair);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.pn{flex:0 0 auto;width:60px;height:60px;border-radius:18px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;position:relative}
.pn .ico{position:absolute;right:-8px;top:-8px;width:24px;height:24px;color:var(--star);filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.pt{flex:1;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;color:var(--muted);font-weight:600}
.skill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--fg)}
.skill i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.diff{display:inline-flex;gap:1px;color:var(--star)}
.diff svg{width:15px;height:15px}
.badge2{border-radius:999px;padding:2px 10px;background:var(--fg);color:var(--bg);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.ph h1{margin:4px 0 0;font-family:var(--read);font-size:clamp(1.1rem,1.8vw,1.4rem);line-height:1.3;font-weight:700;text-wrap:balance}
.acts{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.acts .grp{display:flex;gap:8px}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--hair);background:var(--surface);display:grid;place-items:center;padding:0}
.ib:hover{background:var(--surface-2)}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:20px;height:20px}
.ib.next{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.ib.next.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 25%,transparent)}}

.winbar{display:none;align-items:center;gap:12px;background:var(--good-soft);border-radius:16px;padding:10px 12px 10px 14px}
.winbar.show{display:flex;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.winbar .ico{width:34px;height:34px;color:var(--star);flex:0 0 auto}
.winbar b{font-family:var(--head);font-size:1.05rem;display:block;line-height:1.2}
.winbar span.t{flex:1;min-width:0;color:var(--muted);font-size:.9rem}
.winbar .go{border:0;border-radius:12px;background:var(--good);color:var(--surface);font-weight:700;padding:9px 14px;white-space:nowrap}

.work{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.rail{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.panel h2{margin:0 0 6px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.panel p{margin:0;font-size:.95rem}
.mood{display:flex;gap:8px;margin-top:12px}
.mood button{flex:1;border:1px solid var(--hair);background:var(--surface);border-radius:12px;padding:7px 8px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:.88rem;font-weight:600}
.mood button svg{width:22px;height:22px}
.mood button[aria-pressed="true"]{border-color:var(--ring);background:color-mix(in srgb,var(--ring) 14%,transparent)}
.sol{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:700;font-size:.92rem;color:var(--good);text-decoration:none}
.sol:hover{text-decoration:underline}
.sol svg{width:18px;height:18px}

/* sheet surfaces keep the workbook's own light palette in either theme */
.paper,.bonus{--sheet:#FFFFFF;--ink:#2E2723;--muted:#76685E;--coral:#E5505A;--coral-deep:#B9363F;--orange:#F2922E;--cream:#FFF2E0;--line:#EDDDCB;
  --hint:#FFF6D4;--hint-line:#EFCF6E;--ok:#2C9A57;--ok-soft:#E2F4E8;--no:#D9473F;--r:16px;--display:var(--ui);--body:var(--read);color:var(--ink);font-family:var(--read)}
.paper{container-type:inline-size;min-width:0;background:#fff;border-radius:20px;padding:18px clamp(12px,2.5vw,26px) 22px;box-shadow:var(--shadow);border:1px solid var(--hair);font-size:17px;line-height:1.45}
.bonus{background:var(--hint);border:2px solid var(--hint-line);border-radius:20px;padding:14px}
.bonus h2{margin:0 0 6px;display:flex;align-items:center;gap:8px;font-family:var(--ui);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:#8A6A10}
.bonus h2 .ico{width:26px;height:20px;color:#E9B730}
.bonus p{margin:0;font-weight:700;font-size:1rem}
.bonus .choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.bonus .talk{margin-top:8px;font-size:.88rem;color:var(--muted);font-weight:400}

.mbar{display:none}

@media (max-width:1180px){
  .work{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .nav{position:static;max-height:none;border-radius:18px}
  .brand{padding:12px 14px 8px}
  .prog{margin:0 14px 10px;padding:8px 10px}
  .prog .ico{width:24px;height:24px}
  .navlist{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 12px;scrollbar-width:thin}
  .navlist li{flex:0 0 auto}
  .ni{display:flex;flex-direction:column;gap:2px;width:auto;padding:4px}
  .ni .nt,.ni .ns{display:none}
  .ni .st{width:14px;height:14px}
  .navfoot{display:none}
  .ph{flex-wrap:wrap;gap:12px;padding:12px}
  .pn{width:48px;height:48px;font-size:1.25rem;border-radius:14px}
  .acts{width:100%;justify-content:space-between}
  .acts .pg{display:none}
  .rail{grid-template-columns:minmax(0,1fr)}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;gap:10px;align-items:center;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--hair);
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .mbar .ib{width:56px;height:48px}
  .mbar .mid{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--head);font-weight:700;font-variant-numeric:tabular-nums}
  .mbar .mid .ico{width:22px;height:22px;color:var(--star)}
}

/* ---------- workbook activities (unchanged; sized to the sheet via container queries) ---------- */
.btn{border:0;border-radius:999px;padding:10px 20px;font-family:var(--display);font-weight:700;font-size:1.05rem;cursor:pointer;background:var(--cream);color:var(--coral-deep);display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--coral);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.small{padding:6px 14px;font-size:.95rem}
.btn.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(229,80,90,.18)}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
/* shared bits */
.card{background:var(--sheet);border:2px solid var(--line);border-radius:14px;display:grid;place-items:center;position:relative;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;padding:6px}
.card:hover{border-color:#E2C7AA}
.card:active{transform:scale(.97)}
.card img{width:100%;height:100%;object-fit:contain}
.card.sel{border-color:var(--orange);box-shadow:0 0 0 4px rgba(242,146,46,.25)}
.card.good{border-color:var(--ok);box-shadow:0 0 0 4px rgba(44,154,87,.18);cursor:default}
.card.used{cursor:default}
.ring::after{content:"";position:absolute;inset:-7px;border:4px solid var(--coral);border-radius:50%;pointer-events:none;animation:pop .35s}
.xmark::after{content:"";position:absolute;inset:10%;pointer-events:none;
  background:linear-gradient(45deg,transparent 45%,var(--coral) 45%,var(--coral) 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,var(--coral) 45%,var(--coral) 55%,transparent 55%);animation:pop .3s}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.dot{width:18px;height:18px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px #fff}
.wires{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:2}
.wires line{stroke:var(--coral);stroke-width:5;stroke-linecap:round}
.rel{position:relative}
.chip{border:2px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:1rem;min-width:44px}
.chip.good{border-color:var(--ok);background:var(--ok-soft);color:#1E6B3D}
.chip.imgchip{padding:4px;border-radius:12px;width:64px;height:64px}
.chip.imgchip img{width:100%;height:100%;object-fit:contain}
.say{background:var(--sheet);border:2px solid #D9D2CC;border-radius:18px;padding:10px 16px;font-weight:700;position:relative}
.small-note{color:var(--muted);font-size:.9rem}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}

/* p8 hidden objects */
.hidden-grid{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:14px;align-items:start}
.scene{position:relative;border-radius:16px;overflow:hidden;border:3px solid #F0C86A;cursor:crosshair;touch-action:manipulation}
.scene img{width:100%}
.mark{position:absolute;width:12%;aspect-ratio:1;border:4px solid var(--coral);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:pop .35s;box-shadow:0 0 0 3px rgba(255,255,255,.8)}
.miss{position:absolute;width:6%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.7);transform:translate(-50%,-50%);pointer-events:none;animation:fade .6s forwards}
@keyframes fade{to{opacity:0;transform:translate(-50%,-50%) scale(1.8)}}
.seek{display:flex;flex-direction:column;gap:8px}
.seek .lbl{font-weight:700;font-size:.9rem}
.seek-item{display:flex;align-items:center;gap:6px;border:2px solid #F0A3A8;border-radius:12px;padding:4px 6px;background:var(--sheet)}
.seek-item img{width:56px;height:56px;object-fit:contain}
.tick{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--ink);flex:0 0 auto;display:grid;place-items:center;color:#fff}
.found .tick{background:var(--ok);border-color:var(--ok)}
.found{border-color:var(--ok);background:var(--ok-soft)}
@container (max-width:640px){
  .hidden-grid{grid-template-columns:1fr}
  .seek{flex-direction:row;flex-wrap:wrap;order:-1}
  .seek .lbl{flex-basis:100%}
  .seek-item{flex:1 1 calc(25% - 8px);justify-content:center;padding:2px}
  .seek-item img{width:40px;height:40px}
  .tick{width:20px;height:20px}
}

/* columns for connectors */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px clamp(60px,18cqi,220px);max-width:560px;margin:0 auto}
.cols .card{aspect-ratio:1;width:100%;max-width:130px}
.cols .l{justify-self:start;display:flex;align-items:center;gap:12px}
.cols .r{justify-self:end;display:flex;align-items:center;gap:12px}
.shadow img{filter:none}

/* p10 tracing */
.trace-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.trace{background:var(--cream);border:2px solid #F3D9BA;border-radius:18px;position:relative;padding:8px}
.trace .ref{position:absolute;left:10px;top:10px;width:58px;height:58px;background:#fff;border-radius:12px;padding:4px;border:2px solid var(--line);z-index:1}
.trace svg{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair}
.trace .pct{position:absolute;right:12px;top:12px;font-family:var(--display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.palette{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
@container (max-width:520px){.trace-grid{grid-template-columns:1fr 1fr;gap:8px}.trace .ref{width:40px;height:40px}}

/* p11 pattern rows */
.prow{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.num{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.95rem}
.cells{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;flex:1;min-width:0}
.cell{aspect-ratio:1;border:2px solid var(--line);border-radius:10px;display:grid;place-items:center;padding:4px;background:var(--sheet);position:relative}
.cell img{width:100%;height:100%;object-fit:contain}
.cell.empty{border-color:#9C918A;cursor:pointer}
.cell.empty img.outline{opacity:.5}
.cell .sm{width:58%;height:58%}
.cell.bad{border-color:var(--no)}
.cell.right{border-color:var(--ok)}
@container (max-width:560px){.cells{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* p12 baskets */
.fruitrow{display:grid;gap:10px;justify-content:center}
.fr{display:flex;flex-direction:column;align-items:center;gap:8px}
.fr .card{width:min(84px,16cqi);aspect-ratio:1}
.baskets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:40px auto;max-width:600px}
.basket,.target{background:none;border:0;padding:0;font:inherit;color:inherit}
.basket{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative}
.basket .bimg{width:min(150px,26cqi)}
.sign{width:64px;height:64px;border:3px solid var(--coral);border-radius:50%;padding:8px;background:#fff}
.basket .cnt{font-family:var(--display);font-weight:800;color:var(--coral-deep);min-height:1.4em}
.basket.sel .bimg{filter:drop-shadow(0 0 6px rgba(242,146,46,.8))}

/* p13 cut rows */
.cutrow{display:grid;grid-template-columns:minmax(0,1.1fr) 40px repeat(3,minmax(0,1fr));gap:10px;align-items:center;background:var(--cream);border:2px solid #F3D9BA;border-radius:16px;padding:10px;margin-bottom:10px}
.cutrow .card{aspect-ratio:1}
.cutrow .whole{cursor:default}
.arrow{height:4px;background:var(--coral);border-radius:2px;position:relative}
.arrow::after{content:"";position:absolute;right:-2px;top:-5px;border:7px solid transparent;border-left:10px solid var(--coral);border-right:0}
@container (max-width:480px){.cutrow{grid-template-columns:minmax(0,1fr) 18px repeat(3,minmax(0,1fr));gap:6px}}

/* p14 people/tools */
.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.four .card{aspect-ratio:3/4;padding:0;overflow:hidden}
.four .card img{object-fit:cover}
.four .tool{aspect-ratio:1;padding:10px}
.four .cellwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.gap-big{height:clamp(50px,10cqi,90px)}
.sentences{display:flex;flex-direction:column;gap:8px;margin-top:14px;align-items:flex-start}
.speaker{display:flex;gap:12px;align-items:center;margin-top:14px}
.speaker img{width:70px}

/* p15 counting */
.count-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.cb{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 4px;border-radius:14px}
.cb.good{background:var(--ok-soft)}
.cb img{width:100%;max-width:150px}
.circles,.nums{display:flex;gap:3px;border:2px solid var(--line);border-radius:999px;padding:4px 6px;background:#fff}
.circles button{width:clamp(14px,3cqi,22px);aspect-ratio:1;border-radius:50%;border:2px solid var(--ink);background:#fff;padding:0;cursor:pointer}
.circles button.on{background:var(--coral);border-color:var(--coral-deep)}
.nums{background:#FFF4E6}
.nums button{border:0;background:none;font-family:var(--display);font-weight:700;font-size:clamp(.85rem,2.2cqi,1.1rem);width:clamp(16px,3.4cqi,26px);aspect-ratio:1;border-radius:50%;cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.nums button.on{box-shadow:inset 0 0 0 2.5px var(--coral);color:var(--coral-deep)}
.namuna{font-size:.75rem;color:var(--muted);background:#F1ECE7;border-radius:999px;padding:1px 8px}
@container (max-width:620px){.count-grid{grid-template-columns:1fr}.cb{flex-direction:row;flex-wrap:wrap;justify-content:center}.cb img{max-width:110px}}

/* p16 tree/garden */
.tg{display:flex;flex-direction:column;align-items:center;gap:30px}
.target{display:flex;align-items:center;gap:14px;cursor:pointer;flex-direction:column}
.target img{width:min(200px,40cqi)}
.target.wide img{width:min(300px,60cqi)}
.target .lab{font-family:var(--display);font-weight:800;letter-spacing:.12em;color:var(--muted)}
.target.sel img{filter:drop-shadow(0 0 8px rgba(242,146,46,.9))}
.six{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;width:100%;max-width:640px}
.six .fr .card{width:100%}
@container (max-width:520px){.six{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* p17 shelves */
.shelf{background:var(--cream);border:2px solid #F3D9BA;border-radius:18px;padding:12px}
.shelf h3{margin:0 0 6px;font-family:var(--display);font-size:1.1rem}
.shelf img{border-radius:10px}
.cover{position:relative}
.cover .curtain{position:absolute;inset:0;border-radius:10px;background:repeating-linear-gradient(45deg,#F6C9A0 0 14px,#F3BE8F 14px 28px);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--coral-deep);font-size:1.3rem}
.opts3{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opts3 .card{width:96px;aspect-ratio:1}
.timerbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.timerbar i{display:block;height:100%;background:var(--orange);width:100%}

/* p18 / p23 rows */
.irow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.irow .items{display:grid;gap:8px;flex:1;min-width:0}
.irow .card{aspect-ratio:1}
.irow.okrow .card{opacity:.75}
.irow.okrow .card.good{opacity:1}

/* p19 paths */
.pathrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,5fr) minmax(0,1fr);align-items:center;gap:6px;margin-bottom:16px}
.pathrow svg{width:100%;height:auto;touch-action:none;display:block}
.pathrow .end{opacity:.55;transition:opacity .3s,transform .3s}
.pathrow.done .end{opacity:1;transform:scale(1.08)}

/* p20 prepositions */
.prep{display:grid;grid-template-columns:minmax(0,1.1fr) repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px;align-items:stretch}
.prep .phr{background:var(--cream);border:2px solid #F3D9BA;border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:8px;font-family:var(--display);font-weight:700;font-size:1.15rem;position:relative}
.prep .phr em{font-style:normal;color:var(--coral)}
.prep .phr .num{position:absolute;left:8px;top:8px}
.prep .card{aspect-ratio:4/5;padding:0;overflow:hidden}
.prep .card img{object-fit:cover}

/* p21 maze */
.maze-wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.maze-wrap svg{width:100%;max-width:520px;height:auto;touch-action:none;display:block;margin:0 auto}
.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:6px}
.pad button{border:0;border-radius:14px;background:var(--cream);color:var(--coral-deep);cursor:pointer;display:grid;place-items:center}
.pad button svg{width:26px;height:26px}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}
@container (max-width:620px){.maze-wrap{grid-template-columns:1fr}.pad{margin:0 auto}}

/* p22 story */
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.three .card{aspect-ratio:1;padding:0;overflow:hidden;cursor:default}
.three .card img{object-fit:cover}
.endings{background:var(--cream);border:2px solid #F3D9BA;border-radius:18px;padding:12px;margin-top:16px}
.endings h3{text-align:center;margin:0 0 10px;font-family:var(--display)}
.endings .card{cursor:pointer}
.down{width:4px;height:30px;background:#999;margin:8px auto 0;position:relative}
.down::after{content:"";position:absolute;left:-6px;bottom:-4px;border:8px solid transparent;border-top:10px solid #999;border-bottom:0}
.three .num{position:absolute;left:8px;top:8px;z-index:1}

/* p24 / p28 coloring */
.colorbox{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.colorbox canvas{width:100%;height:auto;border:3px solid #F0C86A;border-radius:16px;touch-action:manipulation;cursor:pointer;background:#fff;display:block}
.pick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.pick .card{aspect-ratio:1}
@container (max-width:520px){.pick{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* p25 spot */
.spot{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:14px;align-items:center}
.spot .scene{border-color:#F0C86A}
.spot .side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.spot .side img{width:110px}
.found-count{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--coral-deep);font-variant-numeric:tabular-nums}
@container (max-width:620px){.spot{grid-template-columns:1fr}.spot .side{flex-direction:row;justify-content:center}.spot .side img{width:70px}}

/* p26 dots */
.dotrow{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1.6fr);gap:12px;align-items:center;background:var(--cream);border:2px solid #F3D9BA;border-radius:18px;padding:12px;margin-bottom:12px;position:relative}
.dotrow .numtag{position:absolute;left:10px;top:10px}
.dotrow figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.dotrow figcaption{font-family:var(--display);font-weight:700;color:var(--muted)}
.dotrow svg{width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)}
.dotrow .user svg{border-color:#8D847E;touch-action:manipulation;max-width:300px;margin:0 auto}
.dotrow figure svg{max-width:200px}
.dotrow .arrow{background:#999}.dotrow .arrow::after{border-left-color:#999}
.dotrow.ok{background:var(--ok-soft);border-color:#B8E2C6}

/* p27 test */
.test{background:var(--cream);border:2px solid #F3D9BA;border-radius:18px;padding:12px 14px;margin-bottom:12px}
.test h3{margin:0 0 10px;display:flex;align-items:center;gap:8px;font-size:1.05rem}
.test .rowi{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.test .card{width:min(72px,10.5cqi);aspect-ratio:3/4}
.test .q{border:3px dashed #A99F98;border-radius:14px;width:min(72px,10.5cqi);aspect-ratio:3/4;display:grid;place-items:center;font-family:var(--display);font-size:2rem;color:#A99F98;background:#fff}
.test .q img{width:100%;height:100%;object-fit:contain}
.test .bar{width:2px;align-self:stretch;background:#8A807A;margin:0 6px}
.test.ok{background:var(--ok-soft);border-color:#B8E2C6}

/* finale */
.finale{margin-top:14px;background:#FBF3EA;border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:16px}
.finale h3{font-family:var(--display);color:var(--coral);margin:0;font-size:1.4rem}
.finale p{margin:4px 0 0}
.finale .crown{width:70px;height:56px;color:#F2C230;flex:0 0 auto;margin-left:auto}
/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:12px;border-radius:50%;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.act{display:block}

/* ---------- sound & motion ---------- */
.ico{display:inline-block}
.ib.tog[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent)}
.mascot{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;pointer-events:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mascot .duo{display:flex;align-items:flex-end;gap:4px}
.mascot .who{height:96px;transform-origin:50% 100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.mascot .who img{height:100%;width:auto;object-fit:contain;object-position:bottom}
.mascot .who.lola{animation:breathe 3.2s ease-in-out infinite}
.mascot .who.bek{animation:breathe 3.6s ease-in-out infinite .9s}
.mascot .who.chalkash{animation:spin 6s ease-in-out infinite}
@keyframes spin{50%{transform:rotate(-6deg) translateY(-3px)}}
.mascot[data-who="chalkash"] .bub{border-color:#B7A3E8}
.mascot .bub{position:relative;z-index:1;background:var(--surface);color:var(--fg);border:1px solid var(--hair);box-shadow:var(--shadow);border-radius:16px 16px 4px 16px;padding:7px 12px;font-family:var(--read);font-weight:700;font-size:.98rem;max-width:220px;opacity:0;transform:translateY(6px) scale(.9);transform-origin:100% 100%;transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.4,1)}
.mascot[data-who="lola"] .bub{align-self:flex-start;border-radius:16px 16px 16px 4px;transform-origin:0 100%}
.mascot .bub.show{opacity:1;transform:none}
.mascot .who.hop{animation:hop .55s cubic-bezier(.3,1.6,.5,1)}
.mascot .who.nope{animation:nope .5s ease-in-out}
.mascot .who.win{animation:winjump .9s cubic-bezier(.3,1.4,.5,1)}
.mascot .who.bek.win{animation-delay:.12s}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
@keyframes hop{30%{transform:translateY(-22px) scale(.95,1.06)}60%{transform:translateY(0) scale(1.08,.92)}}
@keyframes nope{20%{transform:rotate(-9deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-5deg)}}
@keyframes winjump{25%{transform:translateY(-26px) rotate(-10deg) scale(1.08)}50%{transform:translateY(-26px) rotate(10deg) scale(1.08)}80%{transform:translateY(0) scale(1.1,.9)}}
.spark{position:fixed;left:0;top:0;width:10px;height:10px;pointer-events:none;z-index:40;animation:spark .7s ease-out forwards}
@keyframes spark{from{transform:translate(var(--x),var(--y)) scale(1) rotate(0deg)}to{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) scale(.2) rotate(180deg);opacity:0}}
.flystar{position:fixed;left:-22px;top:-22px;width:44px;height:44px;color:var(--star);z-index:45;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.flystar svg{width:100%;height:100%;display:block}
.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.4)}}
@media (max-width:860px){.mascot{bottom:calc(78px + env(safe-area-inset-bottom,0px));right:max(10px,env(safe-area-inset-right,0px))}.mascot .who{height:66px}.mascot .bub{font-size:.9rem;max-width:180px}}
@media (prefers-reduced-motion:reduce){.spark,.flystar{display:none}}

/* ---------- rewards, profiles, overlays, ambience ---------- */
.app{position:relative;z-index:1}
.leaves{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.75}
.walker{position:fixed;left:-120px;bottom:calc(6px + env(safe-area-inset-bottom,0px));width:72px;z-index:0;pointer-events:none;opacity:0}
.walker img{width:100%}
.walker.go{animation:walk 16s linear forwards}
@keyframes walk{0%{opacity:0;transform:translateX(0)}4%{opacity:.9}96%{opacity:.9}100%{opacity:0;transform:translateX(calc(100vw + 160px))}}
@media (max-width:860px){.walker{bottom:calc(74px + env(safe-area-inset-bottom,0px));width:50px}}

.who-chip{display:flex;align-items:center;gap:8px;margin:0 16px 10px;border:1px solid var(--hair);background:var(--surface-2);border-radius:999px;padding:5px 12px 5px 6px;width:calc(100% - 32px);text-align:left}
.who-chip .av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:.8rem;flex:0 0 auto}
.who-chip .nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-chip svg{width:16px;height:16px;color:var(--muted)}

.garden{position:relative;margin:0 16px 10px;border-radius:14px;overflow:hidden;aspect-ratio:16/9;background:linear-gradient(#CDE7F7 0%,#EAF4FA 58%,#8FC46A 58%,#6FA94E 100%);cursor:pointer;border:0;padding:0;width:calc(100% - 32px);display:block}
.garden.big{margin:0;width:100%;aspect-ratio:16/10;border-radius:20px;cursor:default;max-height:60vh}
.garden .sun{position:absolute;right:6%;top:8%;width:12%;aspect-ratio:1;border-radius:50%;background:#FFD866;box-shadow:0 0 0 6px rgba(255,216,102,.35),0 0 24px rgba(255,216,102,.8)}
.garden .tree{position:absolute;left:50%;bottom:12%;width:46%;transform:translateX(-50%)}
.garden .it{position:absolute;transform:translate(-50%,-50%);animation:pop .5s cubic-bezier(.2,1.6,.4,1) backwards;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.garden .it.fly{animation:pop .5s cubic-bezier(.2,1.6,.4,1) backwards,flutter 3s ease-in-out infinite 1s}
@keyframes flutter{50%{transform:translate(-50%,-50%) translateY(-8px) rotate(6deg)}}
.garden .lbl{position:absolute;left:8px;top:6px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#2F5E25;background:rgba(255,255,255,.7);border-radius:999px;padding:1px 8px}
.garden .cnt{position:absolute;right:8px;bottom:6px;font-family:var(--head);font-weight:700;font-size:.8rem;color:#2F5E25;background:rgba(255,255,255,.75);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.garden .rainbow{position:absolute;left:50%;top:38%;width:60%;aspect-ratio:2/1;transform:translateX(-50%);border-radius:50% 50% 0 0/100% 100% 0 0;border:10px solid transparent;border-bottom:0;border-image:linear-gradient(#E5505A,#F2922E,#F2C230,#2C9A57,#6FB7E8) 1;opacity:.55;animation:pop .8s backwards}
.garden.big .lbl{font-size:.8rem}.garden.big .cnt{font-size:1rem}

.navfoot{display:flex;flex-wrap:wrap;gap:4px 12px}
.navfoot .linkbtn{padding:4px 0}

.overlay{position:fixed;inset:0;z-index:60;background:rgba(20,24,22,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;overflow:auto}
.overlay[hidden]{display:none}
.ov-box{position:relative;width:min(760px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);color:var(--fg);border-radius:24px;padding:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.ov-x{position:absolute;right:12px;top:12px;z-index:2}
.ov-box h2{font-family:var(--head);font-size:1.3rem;margin:0 0 6px;padding-right:48px}
.ov-box h3{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.ov-box p{margin:0 0 8px}
.ov-box .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn2{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--surface-2);color:var(--fg);display:inline-flex;align-items:center;gap:8px}
.btn2.primary{background:var(--accent);color:var(--accent-fg)}
.btn2.good{background:var(--good);color:var(--surface)}
.btn2:disabled{opacity:.4}
.btn2 svg{width:18px;height:18px}
.inp{font:inherit;border:1px solid var(--hair);border-radius:12px;padding:9px 12px;background:var(--surface);color:var(--fg);min-width:0;flex:1}
.sel{font:inherit;border:1px solid var(--hair);border-radius:12px;padding:8px 12px;background:var(--surface);color:var(--fg)}

/* story intro */
.story{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:end;min-height:200px}
.story img{width:110px;height:170px;object-fit:contain;object-position:bottom}
.story .sb{background:var(--surface-2);border-radius:18px 18px 18px 4px;padding:14px 16px;font-family:var(--read);font-size:1.15rem;font-weight:700;line-height:1.4;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.story.right{grid-template-columns:minmax(0,1fr) 110px}
.story.right img{order:2}
.story.right .sb{border-radius:18px 18px 4px 18px}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--hair)}
.dots i.on{background:var(--accent)}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.bd{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:1px solid var(--hair);border-radius:16px;padding:12px 8px;background:var(--surface)}
.bd .ic{width:64px;height:64px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;padding:10px;position:relative}
.bd .ic img{width:100%;height:100%;object-fit:contain}
.bd .ic .ico{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;color:var(--star)}
.bd b{font-size:.88rem}
.bd small{color:var(--muted);font-size:.75rem}
.bd.locked{opacity:.45}
.bd.locked .ic img{filter:grayscale(1)}
.bd.locked .ic{background:repeating-linear-gradient(45deg,var(--surface-2) 0 6px,var(--hair) 6px 12px)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);z-index:70;background:var(--fg);color:var(--bg);border-radius:999px;padding:10px 18px;font-weight:700;display:flex;align-items:center;gap:10px;opacity:0;transition:opacity .25s,transform .35s cubic-bezier(.2,1.4,.4,1);pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast img{width:30px;height:30px;object-fit:contain}

/* certificate */
.cert{--ink:#2E2723;background:#FFFBF2;color:var(--ink);border:10px double #E5505A;border-radius:12px;padding:28px 24px;text-align:center;font-family:var(--read);position:relative;overflow:hidden}
.cert .ttl{font-family:var(--head);color:#B9363F;font-size:1.6rem;letter-spacing:.08em;text-transform:uppercase}
.cert .sub{font-size:.95rem;color:#76685E;margin-top:2px}
.cert .name{font-family:var(--head);font-size:2rem;margin:18px 0 6px;border-bottom:2px solid #EDDDCB;display:inline-block;padding:0 24px 4px;min-width:60%}
.cert .txt{font-size:1.1rem;max-width:40ch;margin:8px auto}
.cert .stars{font-family:var(--head);font-size:1.3rem;color:#B9363F;margin:8px 0}
.cert .stars .ico{display:inline-block;width:26px;height:26px;vertical-align:-5px;color:#F2A81E}
.cert .duo{display:flex;justify-content:center;gap:16px;align-items:flex-end;margin-top:14px}
.cert .duo img{height:120px}
.cert .dt{font-size:.85rem;color:#76685E;margin-top:12px}
.cert .crown{position:absolute;left:14px;top:12px;width:44px;color:#F2C230}
.cert .crown2{position:absolute;right:14px;top:12px;width:44px;color:#F2C230}
.cert-actions{margin-top:14px}
@media print{body>*{display:none!important}body>#ov{display:block!important;position:static;background:none;padding:0}.ov-box{box-shadow:none;max-height:none;overflow:visible;padding:0;width:100%}.ov-x,.cert-actions,.ov-box h2{display:none!important}.cert{border-color:#E5505A;-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* report */
.rep{width:100%;border-collapse:collapse;font-size:.9rem}

page(17, 1, 'Mosini yopiştir.', 'dasturxon yozganda bola har kosa yoniga qoşiq qöysin.', (act, api) => {
  // drag/tap pairing: left items (teapot, pot, bowl) -> targets (cup, ladle, spoon)
  const L = [['choynak', 'Çoynak', 'c'], ['qozon', 'Qozon', 'q'], ['kosa', 'Kosa', 'k']];
  const Rr = [['qoshiq', 'Qoşiq', 'k'], ['piyola', 'Piyola', 'c'], ['kapgir', 'Kapgir', 'q']];
  const grid = h('div', { class: 'cols rel' }); const A = [], B = [];
  L.forEach(([id, n, k], i) => { const c = card('s-' + id, n, { 'data-k': k }); const d = h('span', { class: 'dot' }); c._dot = d; const w = h('div', { class: 'l' }, c, d); w.style.gridRow = i + 1; w.style.gridColumn = 1; A.push(c); grid.append(w); });
  Rr.forEach(([id, n, k], i) => { const c = card('s-' + id, n, { 'data-k': k }); const d = h('span', { class: 'dot' }); c._dot = d; const w = h('div', { class: 'r' }, d, c); w.style.gridRow = i + 1; w.style.gridColumn = 2; B.push(c); grid.append(w); });
  pairing({ root: grid, A, B, match: (a, b) => a.dataset.k === b.dataset.k, dotOf: n => n._dot, onDone: api.done });
  act.append(grid, h('p', { class: 'small-note' }, 'Çoynakka — piyola, qozonga — kapgir, kosaga — qoşiq. Bosib yoki sudrab ula.'));
}, { text: 'Çoyni nimaga quyamiz?', choices: [{ label: 'Piyolaga', ok: true }, { label: 'Qozonga' }, { label: 'Kapgirga' }] });

if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude/.test(location.hostname)) { try { navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {}); } catch {} }

paintWho(); paintGarden();
if (!store.get('introSeen', false)) { store.set('introSeen', true); setTimeout(() => openStory(true), 600); }

const prev = () => go(cur - 1), next = () => go(cur + 1);
$('#prevP').onclick = prev; $('#mPrev').onclick = prev;
$('#nextP').onclick = next; $('#mNext').onclick = next; $('#winNext').onclick = next;
$('#restart').onclick = () => { go(cur, true, curVariant); tone('tap'); };
$('#again').onclick = () => { go(cur, true, curVariant + 1); tone('page'); react('yes', 'Yangi variant! Yana urinib kör.'); };
document.addEventListener('keydown', e => {
  if (!e.shiftKey || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
  e.preventDefault(); e.key === 'ArrowRight' ? next() : prev();
});

const sb = $('#soundBtn');
const paintSound = () => { sb.innerHTML = soundOn ? SPK_ON : SPK_OFF; sb.setAttribute('aria-pressed', String(soundOn)); sb.setAttribute('aria-label', soundOn ? 'Ovozni öçiriş' : 'Ovozni yoqiş'); sb.title = sb.getAttribute('aria-label'); };
sb.onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); paintSound(); if (master) master.gain.setTargetAtTime(soundOn ? 1 : 0, ac.currentTime, .05); tone('tap'); };
paintSound();

const fromHash = () => { const m = /^#p(\d+)$/.exec(location.hash); return m ? PAGES.findIndex(p => p.n === +m[1]) : -1; };
window.addEventListener('hashchange', () => { const i = fromHash(); if (i >= 0 && i !== cur) go(i, true); });
const start = fromHash(); go(start >= 0 ? start : 0, true);
})();
