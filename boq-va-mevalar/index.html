<title>Boğ va mevalar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: a workbook you leaf through — coral chapter band, a strip of page tabs, one activity sheet at a time.
   Single light look on purpose: the illustrations are drawn on white paper. */
:root{
  --paper:#FFFBF4;
  --sheet:#FFFFFF;
  --ink:#2E2723;
  --muted:#76685E;
  --coral:#E5505A;
  --coral-deep:#B9363F;
  --orange:#F2922E;
  --cream:#FFF2E0;
  --line:#EDDDCB;
  --hint:#FFF6D4;
  --hint-line:#EFCF6E;
  --ok:#2C9A57;
  --ok-soft:#E2F4E8;
  --no:#D9473F;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Andika','Segoe UI',system-ui,sans-serif;
  --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--coral)}
button{font:inherit;color:inherit}
img{max-width:100%;display:block;user-select:none;-webkit-user-drag:none}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* chapter band */
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--coral);color:#fff;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band-in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:8px}
.band h1{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0;letter-spacing:.02em;line-height:1.1}
.band .kicker{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.9;font-weight:700}
.band .grow{flex:1;min-width:0}
.score{display:flex;align-items:center;gap:6px;background:#fff;color:var(--coral-deep);border-radius:999px;padding:4px 12px 4px 8px;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.icon-btn{border:0;background:rgba(255,255,255,.18);color:#fff;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.3)}

.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}

/* page tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.tab{flex:0 0 auto;width:46px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--sheet);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1;gap:2px;font-variant-numeric:tabular-nums}
.tab .st{width:14px;height:14px;color:var(--line)}
.tab.done .st{color:var(--orange)}
.tab[aria-current="page"]{border-color:var(--coral);background:var(--coral);color:#fff}
.tab[aria-current="page"] .st{color:#fff}
.tab.done[aria-current="page"] .st{color:#FFE08A}

/* sheet */
.sheet{background:var(--sheet);border-radius:22px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(120,60,30,.35);padding:18px clamp(14px,3vw,30px) 22px;position:relative}
.sheet-head{display:flex;gap:14px;align-items:flex-start}
.pnum{flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums;box-shadow:0 0 0 5px #fff,0 0 0 7px var(--cream)}
.task{flex:1;min-width:0}
.task h2{font-family:var(--display);font-weight:700;font-size:clamp(1.15rem,2.4vw,1.45rem);line-height:1.25;margin:2px 0 0;text-wrap:balance}
.badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--coral-deep);background:var(--cream);border-radius:999px;padding:2px 10px;margin-bottom:4px}
.diff{flex:0 0 auto;display:flex;gap:2px;color:var(--orange)}
.diff svg{width:22px;height:22px}
.tab .st svg,.win span svg,.hint .crown svg,.finale .crown svg{width:100%;height:100%;display:block}
.win span:first-child{width:28px;height:28px;flex:0 0 auto}
.act{margin-top:18px}

.hint{margin-top:18px;background:var(--hint);border:2px solid var(--hint-line);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.hint .crown{flex:0 0 auto;width:30px;height:24px;color:#E9B730}
.hint .htext{flex:1;min-width:200px}
.hint b{font-weight:700}
.hint .choices{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.foot{margin-top:16px;border-top:2px solid var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.together{color:var(--muted);font-size:.95rem;flex:1;min-width:240px;max-width:62ch}
.together b{color:var(--ink)}
.mood{display:flex;gap:8px}
.mood button{border:2px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 12px 4px 6px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.92rem}
.mood button svg{width:24px;height:24px}
.mood button[aria-pressed="true"]{border-color:var(--orange);background:#FFF0DC}

.nav{display:flex;justify-content:space-between;gap:12px;margin-top:16px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-family:var(--display);font-weight:700;font-size:1.05rem;cursor:pointer;background:var(--cream);color:var(--coral-deep);display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--coral);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn.small{padding:6px 14px;font-size:.95rem}
.btn.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(229,80,90,.18)}}

.win{display:none;align-items:center;gap:10px;margin-top:14px;background:var(--ok-soft);color:#1E6B3D;border-radius:var(--r);padding:10px 14px;font-family:var(--display);font-weight:700;font-size:1.15rem}
.win.show{display:flex;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.win svg{width:28px;height:28px;color:var(--orange)}
@keyframes pop{from{transform:scale(.85);opacity:0}}

/* shared bits */
.card{background:var(--sheet);border:2px solid var(--line);border-radius:14px;display:grid;place-items:center;position:relative;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;padding:6px}
.card:hover{border-color:#E2C7AA}
.card:active{transform:scale(.97)}
.card img{width:100%;height:100%;object-fit:contain}
.card.sel{border-color:var(--orange);box-shadow:0 0 0 4px rgba(242,146,46,.25)}
.card.good{border-color:var(--ok);box-shadow:0 0 0 4px rgba(44,154,87,.18);cursor:default}
.card.used{cursor:default}
.ring::after{content:"";position:absolute;inset:-7px;border:4px solid var(--coral);border-radius:50%;pointer-events:none;animation:pop .35s}
.xmark::after{content:"";position:absolute;inset:10%;pointer-events:none;
  background:linear-gradient(45deg,transparent 45%,var(--coral) 45%,var(--coral) 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,var(--coral) 45%,var(--coral) 55%,transparent 55%);animation:pop .3s}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.dot{width:18px;height:18px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px #fff}
.wires{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:2}
.wires line{stroke:var(--coral);stroke-width:5;stroke-linecap:round}
.rel{position:relative}
.chip{border:2px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:1rem;min-width:44px}
.chip.good{border-color:var(--ok);background:var(--ok-soft);color:#1E6B3D}
.chip.imgchip{padding:4px;border-radius:12px;width:64px;height:64px}
.chip.imgchip img{width:100%;height:100%;object-fit:contain}
.say{background:var(--sheet);border:2px solid #D9D2CC;border-radius:18px;padding:10px 16px;font-weight:700;position:relative}
.small-note{color:var(--muted);font-size:.9rem}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}

/* p8 hidden objects */
.hidden-grid{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:14px;align-items:start}
.scene{position:relative;border-radius:16px;overflow:hidden;border:3px solid #F0C86A;cursor:crosshair;touch-action:manipulation}
.scene img{width:100%}
.mark{position:absolute;width:12%;aspect-ratio:1;border:4px solid var(--coral);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:pop .35s;box-shadow:0 0 0 3px rgba(255,255,255,.8)}
.miss{position:absolute;width:6%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.7);transform:translate(-50%,-50%);pointer-events:none;animation:fade .6s forwards}
@keyframes fade{to{opacity:0;transform:translate(-50%,-50%) scale(1.8)}}
.seek{display:flex;flex-direction:column;gap:8px}
.seek .lbl{font-weight:700;font-size:.9rem}
.seek-item{display:flex;align-items:center;gap:6px;border:2px solid #F0A3A8;border-radius:12px;padding:4px 6px;background:var(--sheet)}
.seek-item img{width:56px;height:56px;object-fit:contain}
.tick{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--ink);flex:0 0 auto;display:grid;place-items:center;color:#fff}
.found .tick{background:var(--ok);border-color:var(--ok)}
.found{border-color:var(--ok);background:var(--ok-soft)}
@media (max-width:640px){
  .hidden-grid{grid-template-columns:1fr}
  .seek{flex-direction:row;flex-wrap:wrap;order:-1}
  .seek .lbl{flex-basis:100%}
  .seek-item{flex:1 1 calc(25% - 8px);justify-content:center;padding:2px}
  .seek-item img{width:40px;height:40px}
  .tick{width:20px;height:20px}
}

/* columns for connectors */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px clamp(60px,18vw,220px);max-width:560px;margin:0 auto}
.cols .card{aspect-ratio:1;width:100%;max-width:120px}
.cols .l{justify-self:start;display:flex;align-items:center;gap:12px}
.cols .r{justify-self:end;display:flex;align-items:center;gap:12px}
.shadow img{filter:none}

/* p10 tracing */
.trace-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.trace{background:var(--cream);border:2px solid #F3D9BA;border-radius:18px;position:relative;padding:8px}
.trace .ref{position:absolute;left:10px;top:10px;width:58px;height:58px;background:#fff;border-radius:12px;padding:4px;border:2px solid var(--line);z-index:1}
.trace svg{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair}
.trace .pct{position:absolute;right:12px;top:12px;font-family:var(--display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.palette{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
@media (max-width:520px){.trace-grid{grid-template-columns:1fr 1fr;gap:8px}.trace .ref{width:40px;height:40px}}

/* p11 pattern rows */
.prow{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.num{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.95rem}
.cells{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;flex:1;min-width:0}
.cell{aspect-ratio:1;border:2px solid var(--line);border-radius:10px;display:grid;place-items:center;padding:4px;background:var(--sheet);position:relative}
.cell img{width:100%;height:100%;object-fit:contain}
.cell.empty{border-color:#9C918A;cursor:pointer}
.cell.empty img.outline{opacity:.5}
.cell .sm{width:58%;height:58%}
.cell.bad{border-color:var(--no)}
.cell.right{border-color:var(--ok)}
@media (max-width:560px){.cells{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* p12 baskets */
.fruitrow{display:grid;gap:10px;justify-content:center}
.fr{display:flex;flex-direction:column;align-items:center;gap:8px}
.fr .card{width:min(84px,16vw);aspect-ratio:1}
.baskets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:40px auto;max-width:600px}
.basket,.target{background:none;border:0;padding:0;font:inherit;color:inherit}
.basket{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative}
.basket .bimg{width:min(150px,26vw)}
.sign{width:64px;height:64px;border:3px solid var(--coral);border-radius:50%;padding:8px;background:#fff}
.basket .cnt{font-family:var(--display);font-weight:800;color:var(--coral-deep);min-height:1.4em}
.basket.sel .bimg{filter:drop-shadow(0 0 6px rgba(242,146,46,.8))}

/* p13 cut rows */
.cutrow{display:grid;grid-template-columns:minmax(0,1.1fr) 40px repeat(3,minmax(0,1fr));gap:10px;align-items:center;background:var(--cream);border:2px solid #F3D9BA;border-radius:16px;padding:10px;margin-bottom:10px}
.cutrow .card{aspect-ratio:1}
.cutrow .whole{cursor:default}
.arrow{height:4px;background:var(--coral);border-radius:2px;position:relative}
.arrow::after{content:"";position:absolute;right:-2px;top:-5px;border:7px solid transparent;border-left:10px solid var(--coral);border-right:0}
@media (max-width:480px){.cutrow{grid-template-columns:minmax(0,1fr) 18px repeat(3,minmax(0,1fr));gap:6px}}

/* p14 people/tools */
.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.four .card{aspect-ratio:3/4;padding:0;overflow:hidden}
.four .card img{object-fit:cover}
.four .tool{aspect-ratio:1;padding:10px}
.four .cellwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.gap-big{height:clamp(50px,10vw,90px)}
.sentences{display:flex;flex-direction:column;gap:8px;margin-top:14px;align-items:flex-start}
.speaker{display:flex;gap:12px;align-items:center;margin-top:14px}
.speaker img{width:70px}

/* p15 counting */
.count-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.cb{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 4px;border-radius:14px}
.cb.good{background:var(--ok-soft)}
.cb img{width:100%;max-width:150px}
.circles,.nums{display:flex;gap:3px;border:2px solid var(--line);border-radius:999px;padding:4px 6px;background:#fff}
.circles button{width:clamp(14px,3vw,22px);aspect-ratio:1;border-radius:50%;border:2px solid var(--ink);background:#fff;padding:0;cursor:pointer}
.circles button.on{background:var(--coral);border-color:var(--coral-deep)}
.nums{background:#FFF4E6}
.nums button{border:0;background:none;font-family:var(--display);font-weight:700;font-size:clamp(.85rem,2.2vw,1.1rem);width:clamp(16px,3.4vw,26px);aspect-ratio:1;border-radius:50%;cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.nums button.on{box-shadow:inset 0 0 0 2.5px var(--coral);color:var(--coral-deep)}
.namuna{font-size:.75rem;color:var(--muted);background:#F1ECE7;border-radius:999px;padding:1px 8px}
@media (max-width:620px){.count-grid{grid-template-columns:1fr}.cb{flex-direction:row;flex-wrap:wrap;justify-content:center}.cb img{max-width:110px}}

/* p16 tree/garden */
.tg{display:flex;flex-direction:column;align-items:center;gap:30px}
.target{display:flex;align-items:center;gap:14px;cursor:pointer;flex-direction:column}
.target img{width:min(200px,40vw)}
.target.wide img{width:min(300px,60vw)}
.target .lab{font-family:var(--display);font-weight:800;letter-spacing:.12em;color:var(--muted)}
.target.sel img{filter:drop-shadow(0 0 8px rgba(242,146,46,.9))}
.six{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;width:100%;max-width:640px}
.six .fr .card{width:100%}
@media (max-width:520px){.six{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* p17 shelves */
.shelf{background:var(--cream);border:2px solid #F3D9BA;border-radius:18px;padding:12px}
.shelf h3{margin:0 0 6px;font-family:var(--display);font-size:1.1rem}
.shelf img{border-radius:10px}
.cover{position:relative}
.cover .curtain{position:absolute;inset:0;border-radius:10px;background:repeating-linear-gradient(45deg,#F6C9A0 0 14px,#F3BE8F 14px 28px);display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--coral-deep);font-size:1.3rem}
.opts3{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opts3 .card{width:96px;aspect-ratio:1}
.timerbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.timerbar i{display:block;height:100%;background:var(--orange);width:100%}

/* p18 / p23 rows */
.irow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.irow .items{display:grid;gap:8px;flex:1;min-width:0}
.irow .card{aspect-ratio:1}
.irow.okrow .card{opacity:.75}
.irow.okrow .card.good{opacity:1}

/* p19 paths */
.pathrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,5fr) minmax(0,1fr);align-items:center;gap:6px;margin-bottom:16px}
.pathrow svg{width:100%;height:auto;touch-action:none;display:block}
.pathrow .end{opacity:.55;transition:opacity .3s,transform .3s}
.pathrow.done .end{opacity:1;transform:scale(1.08)}

/* p20 prepositions */
.prep{display:grid;grid-template-columns:minmax(0,1.1fr) repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px;align-items:stretch}
.prep .phr{background:var(--cream);border:2px solid #F3D9BA;border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:8px;font-family:var(--display);font-weight:700;font-size:1.15rem;position:relative}
.prep .phr em{font-style:normal;color:var(--coral)}
.prep .phr .num{position:absolute;left:8px;top:8px}
.prep .card{aspect-ratio:4/5;padding:0;overflow:hidden}
.prep .card img{object-fit:cover}

/* p21 maze */
.maze-wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.maze-wrap svg{width:100%;max-width:520px;height:auto;touch-action:none;display:block;margin:0 auto}
.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:6px}
.pad button{border:0;border-radius:14px;background:var(--cream);color:var(--coral-deep);cursor:pointer;display:grid;place-items:center}
.pad button svg{width:26px;height:26px}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}
@media (max-width:620px){.maze-wrap{grid-template-columns:1fr}.pad{margin:0 auto}}

/* p22 story */
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.three .card{aspect-ratio:1;padding:0;overflow:hidden;cursor:default}
.three .card img{object-fit:cover}
.endings{background:var(--cream);border:2px solid #F3D9BA;border-radius:18px;padding:12px;margin-top:16px}
.endings h3{text-align:center;margin:0 0 10px;font-family:var(--display)}
.endings .card{cursor:pointer}
.down{width:4px;height:30px;background:#999;margin:8px auto 0;position:relative}
.down::after{content:"";position:absolute;left:-6px;bottom:-4px;border:8px solid transparent;border-top:10px solid #999;border-bottom:0}
.three .num{position:absolute;left:8px;top:8px;z-index:1}

/* p24 / p28 coloring */
.colorbox{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.colorbox canvas{width:100%;height:auto;border:3px solid #F0C86A;border-radius:16px;touch-action:manipulation;cursor:pointer;background:#fff;display:block}
.pick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.pick .card{aspect-ratio:1}
@media (max-width:520px){.pick{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* p25 spot */
.spot{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:14px;align-items:center}
.spot .scene{border-color:#F0C86A}
.spot .side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.spot .side img{width:110px}
.found-count{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--coral-deep);font-variant-numeric:tabular-nums}
@media (max-width:620px){.spot{grid-template-columns:1fr}.spot .side{flex-direction:row;justify-content:center}.spot .side img{width:70px}}

/* p26 dots */
.dotrow{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1.6fr);gap:12px;align-items:center;background:var(--cream);border:2px solid #F3D9BA;border-radius:18px;padding:12px;margin-bottom:12px;position:relative}
.dotrow .numtag{position:absolute;left:10px;top:10px}
.dotrow figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.dotrow figcaption{font-family:var(--display);font-weight:700;color:var(--muted)}
.dotrow svg{width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)}
.dotrow .user svg{border-color:#8D847E;touch-action:manipulation;max-width:300px;margin:0 auto}
.dotrow figure svg{max-width:200px}
.dotrow .arrow{background:#999}.dotrow .arrow::after{border-left-color:#999}
.dotrow.ok{background:var(--ok-soft);border-color:#B8E2C6}

/* p27 test */
.test{background:var(--cream);border:2px solid #F3D9BA;border-radius:18px;padding:12px 14px;margin-bottom:12px}
.test h3{margin:0 0 10px;display:flex;align-items:center;gap:8px;font-size:1.05rem}
.test .rowi{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.test .card{width:min(76px,15vw);aspect-ratio:3/4}
.test .q{border:3px dashed #A99F98;border-radius:14px;width:min(76px,15vw);aspect-ratio:3/4;display:grid;place-items:center;font-family:var(--display);font-size:2rem;color:#A99F98;background:#fff}
.test .q img{width:100%;height:100%;object-fit:contain}
.test .bar{width:2px;align-self:stretch;background:#8A807A;margin:0 6px}
.test.ok{background:var(--ok-soft);border-color:#B8E2C6}

/* finale */
.finale{margin-top:14px;background:#FBF3EA;border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:16px}
.finale h3{font-family:var(--display);color:var(--coral);margin:0;font-size:1.4rem}
.finale p{margin:4px 0 0}
.finale .crown{width:70px;height:56px;color:#F2C230;flex:0 0 auto;margin-left:auto}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:12px;border-radius:50%;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<header class="band">
  <div class="band-in">
    <div class="grow">
      <div class="kicker">IDC Kids · 3–4 yosh</div>
      <h1>1-bob · Boğ va mevalar</h1>
    </div>
    <div class="score" title="Bajarilgan topşiriqlar"><svg width="20" height="20" viewBox="0 0 24 24" fill="#F2922E"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg><span id="score">0 / 21</span></div>

  </div>
</header>

    <button class="btn primary" id="next">Keyingi ›</button>
  </div>
</main>

<script>
(() => {
'use strict';
const IMG = id => 'img/' + id + (/\.(png|webp)$/.test(id) ? '' : '.webp');
const NS = 'http://www.w3.org/2000/svg';
const $ = (s, r = document) => r.querySelector(s);

function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'html') n.innerHTML = v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
function s(tag, attrs, ...kids) {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) n.setAttribute(k, v);
  for (const c of kids.flat()) if (c) n.append(c);
  return n;
}
const pic = (id, alt = '') => h('img', { src: IMG(id), alt, draggable: 'false', loading: 'lazy' });
const card = (id, alt, extra = {}) => h('button', Object.assign({ class: 'card', type: 'button', 'aria-label': alt }, extra), pic(id, alt));
const STAR = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
const STAR_O = '<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 3.5l2.6 5.5 6 .7-4.4 4.2 1.2 6L12 17l-5.4 2.9 1.2-6L3.4 9.7l6-.7z"/></svg>';
const CROWN = '<svg viewBox="0 0 40 30"><path d="M3 8l9 8 8-13 8 13 9-8-3 19H6z" fill="currentColor" stroke="#C99A1B" stroke-width="1.5" stroke-linejoin="round"/></svg>';
const SMILE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><circle cx="9" cy="10" r=".6" fill="currentColor"/><circle cx="15" cy="10" r=".6" fill="currentColor"/><path d="M8 14.5c1.8 2 6.2 2 8 0" stroke-linecap="round"/></svg>';
const HARD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M8 10.5l2-1M16 10.5l-2-1" stroke-linecap="round"/><path d="M8 16c1.2-1.5 2.5-1 4 0s2.8 1.5 4 0" stroke-linecap="round"/></svg>';
const SPK_ON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const SPK_OFF = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
const ARROW = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${d}deg)"><path d="M12 19V5M5 12l7-7 7 7"/></svg>`;

/* ---------- storage (optional) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('boq.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('boq.' + k, JSON.stringify(v)); } catch {} }
};
let doneSet = new Set(store.get('done', []));
let moods = store.get('moods', {});
let soundOn = store.get('sound', true);

/* ---------- sound ---------- */
let ac = null;
function tone(kind) {
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const seq = { tap: [[660, .06]], yes: [[660, .09], [880, .14]], no: [[220, .18]], win: [[523, .1], [659, .1], [784, .1], [1047, .25]] }[kind] || [];
    let t = ac.currentTime;
    for (const [f, d] of seq) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = kind === 'no' ? 'triangle' : 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02); t += d * .9;
    }
  } catch {}
}
function shake(n) { n.classList.remove('shake'); void n.offsetWidth; n.classList.add('shake'); }
function confetti() {
  const box = h('div', { class: 'confetti' });
  const cols = ['#E5505A', '#F2922E', '#F2C230', '#2C9A57', '#6FB7E8'];
  for (let i = 0; i < 36; i++) {
    const c = h('i'); c.style.left = Math.random() * 100 + '%'; c.style.background = cols[i % cols.length];
    c.style.animationDelay = Math.random() * .4 + 's'; c.style.width = c.style.height = 8 + Math.random() * 8 + 'px';
    box.append(c);
  }
  document.body.append(box); setTimeout(() => box.remove(), 2300);
}

/* ---------- connector lines ---------- */
function wires(root) {
  const svg = s('svg', { class: 'wires' }); root.append(svg);
  const links = [];
  const pt = n => { const r = n.getBoundingClientRect(), R = root.getBoundingClientRect(); return [r.left + r.width / 2 - R.left, r.top + r.height / 2 - R.top]; };
  function draw() {
    svg.replaceChildren();
    svg.setAttribute('width', root.clientWidth); svg.setAttribute('height', root.clientHeight);
    for (const [a, b] of links) { const [x1, y1] = pt(a), [x2, y2] = pt(b); svg.append(s('line', { x1, y1, x2, y2 })); }
  }
  const ro = new ResizeObserver(draw); ro.observe(root);
  return { add(a, b) { links.push([a, b]); draw(); }, draw };
}
/* tap one item from side A and one from side B to connect */
function pairing({ root, A, B, match, dotOf, reuseB, onPair, onDone }) {
  const w = wires(root); let sel = null, left = A.length;
  const clear = () => { if (sel) sel.n.classList.remove('sel'); sel = null; };
  function pick(n, side) {
    if (n.classList.contains('used')) return;
    if (!sel || sel.side === side) { clear(); sel = { n, side }; n.classList.add('sel'); tone('tap'); return; }
    const a = side === 'A' ? n : sel.n, b = side === 'A' ? sel.n : n; clear();
    if (match(a, b)) {
      a.classList.add('used', 'good'); if (!reuseB) b.classList.add('used', 'good');
      w.add(dotOf(a, b), dotOf(b, a)); tone('yes'); onPair && onPair(a, b);
      if (--left === 0) onDone();
    } else { shake(a); shake(b); tone('no'); }
  }
  A.forEach(n => n.addEventListener('click', () => pick(n, 'A')));
  B.forEach(n => n.addEventListener('click', () => pick(n, 'B')));
  return w;
}
/* small multiple-choice used inside the "Zukko qadam" box */
function choice(opts, onRight) {
  const box = h('div', { class: 'choices' });
  opts.forEach(o => {
    const b = o.img ? h('button', { class: 'chip imgchip', type: 'button', 'aria-label': o.label }, pic(o.img, o.label)) : h('button', { class: 'chip', type: 'button' }, o.label);
    b.addEventListener('click', () => {
      if (box.dataset.solved) return;
      if (o.ok) { b.classList.add('good'); box.dataset.solved = 1; tone('yes'); onRight && onRight(); }
      else { shake(b); tone('no'); }
    });
    box.append(b);
  });
  return box;
}

/* ---------- pages ---------- */
const PAGES = [];
const page = (n, stars, title, tip, build, bonus) => PAGES.push({ n, stars, title, tip, build, bonus });

/* 8 — find hidden objects */
page(8, 1, 'Boğni kör! Öngdagi 8 ta narsani rasmdan top. Topganingni belgila.', 'sayrda «Men qizil narsani köryapman...» öyini.', (act, api) => {
  const R = 2400 / 1792;
  const items = [
    ['001', 'tipratikan', [[21, 88]]], ['002', 'muşuk', [[11, 66]]], ['003', 'çumçuq', [[76, 8]]], ['004', 'qölqop', [[11.5, 46.5]]],
    ['005', 'suğorgiç', [[90, 72]]], ['006', 'kapalak', [[82, 88.5]]], ['007', 'şilliqqurt', [[92.5, 78]]], ['008', 'çelak', [[62, 68], [81, 78.5]]]
  ];
  const scene = h('div', { class: 'scene' }, h('img', { src: IMG('000'), alt: 'Kuzgi boğ: bolalar va bobo meva termoqda', draggable: 'false' }));
  const list = h('div', { class: 'seek' }, h('div', { class: 'lbl' }, 'Top va belgila:'));
  const rows = items.map(([id, name]) => { const r = h('div', { class: 'seek-item', title: name }, pic(id, name), h('span', { class: 'tick', html: '' })); list.append(r); return r; });
  let found = 0;
  scene.addEventListener('click', e => {
    const b = scene.getBoundingClientRect();
    const x = (e.clientX - b.left) / b.width * 100, y = (e.clientY - b.top) / b.height * 100;
    let hit = -1, hp = null;
    items.forEach(([, , pts], i) => pts.forEach(p => { if (Math.hypot(p[0] - x, (p[1] - y) * R) < 6.5 && hit < 0) { hit = i; hp = p; } }));
    if (hit >= 0 && !rows[hit].classList.contains('found')) {
      rows[hit].classList.add('found'); rows[hit].querySelector('.tick').innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
      const m = h('span', { class: 'mark' }); m.style.left = hp[0] + '%'; m.style.top = hp[1] + '%'; scene.append(m);
      tone('yes'); if (++found === items.length) api.done();
    } else if (hit < 0) {
      const m = h('span', { class: 'miss' }); m.style.left = x + '%'; m.style.top = y + '%'; scene.append(m); setTimeout(() => m.remove(), 700);
    }
  });
  act.append(h('div', { class: 'hidden-grid' }, scene, list));
}, { text: 'Yerda neçta anor yotibdi? Sana.', choices: [3, 4, 5, 6].map(n => ({ label: String(n), ok: n === 4 })) });

/* 9 — shadows */
page(9, 1, 'Har birini öz soyasi bilan çiziq orqali ula.', 'keçqurun çiroq bilan devorga qöl va öyinçoq soyasini tuşiring — bola topsin.', (act, api) => {
  const L = [['009', 'olma', 'a'], ['010', 'nok', 'p'], ['011', 'anor', 'g'], ['012', 'uzum', 'u'], ['013', 'sabzi', 'c']];
  const Rr = [['014', 'u'], ['015', 'g'], ['016', 'leaf'], ['017', 'a'], ['018', 'c'], ['019', 'p']];
  const grid = h('div', { class: 'cols rel' });
  const A = [], B = [];
  for (let i = 0; i < 6; i++) {
    if (L[i]) { const c = card(L[i][0], L[i][1], { 'data-k': L[i][2] }); const d = h('span', { class: 'dot' }); const w = h('div', { class: 'l' }, c, d); w.style.gridRow = i + 1; w.style.gridColumn = 1; A.push(c); c._dot = d; grid.append(w); }
    const c2 = card(Rr[i][0], 'soya', { 'data-k': Rr[i][1] }); c2.classList.add('shadow'); const d2 = h('span', { class: 'dot' }); const w2 = h('div', { class: 'r' }, d2, c2); w2.style.gridRow = i + 1; w2.style.gridColumn = 2; B.push(c2); c2._dot = d2; grid.append(w2);
  }
  // first column rows: spread 5 items over 6 rows evenly is not needed; keep top-aligned like the book
  pairing({ root: grid, A, B, match: (a, b) => a.dataset.k === b.dataset.k, dotOf: n => n._dot, onDone: api.done });
  act.append(grid);
}, { text: 'Bitta soyaning jufti yöq. U nimaning soyasi?', choices: [{ label: 'Olma' }, { label: 'Barg', ok: true }, { label: 'Uzum' }] });

/* 10 — trace & colour */
page(10, 1, 'Punktir böylab çizib, mevalarni tugat. Keyin ularni böya.', 'qumda yoki un ustida barmoq bilan olma va nok çizing.', (act, api) => {
  const shapes = [
    { img: '020', name: 'olma', body: 'M100 66 C 84 52, 44 52, 40 100 C 36 150, 72 182, 100 168 C 128 182, 164 150, 160 100 C 156 52, 116 52, 100 66 Z', extra: ['M100 66 C 100 52, 104 42, 110 34', 'M104 48 C 112 26, 140 22, 154 30 C 144 46, 122 54, 104 48 Z'] },
    { img: '021', name: 'nok', body: 'M100 46 C 116 46, 120 76, 130 94 C 152 118, 162 138, 156 158 C 148 186, 52 186, 44 158 C 38 138, 48 118, 70 94 C 80 76, 84 46, 100 46 Z', extra: ['M100 46 C 100 34, 104 24, 110 18'] },
    { img: '022', name: 'anor', body: 'M84 54 L78 38 L92 46 L100 32 L108 46 L122 38 L116 54 C 150 62, 168 90, 164 120 C 160 158, 130 180, 100 180 C 70 180, 40 158, 36 120 C 32 90, 50 62, 84 54 Z', extra: [] },
    { img: '023', name: 'tarvuz', body: 'M100 40 A 68 68 0 1 1 99.9 40 Z', extra: [] }
  ];
  const colors = ['#E5404A', '#F5C731', '#7BC74D', '#2E8B3E', '#F28C28', '#8E3B8F', '#8B5A2B'];
  let color = colors[0];
  const pal = h('div', { class: 'palette' }, h('span', { class: 'small-note' }, 'Rang tanla, keyin mevaga bos:'));
  colors.forEach((c, i) => { const b = h('button', { class: 'swatch', type: 'button', 'aria-label': 'rang ' + (i + 1), 'aria-pressed': i === 0 ? 'true' : 'false' }); b.style.background = c; b.onclick = () => { color = c; pal.querySelectorAll('.swatch').forEach(x => x.setAttribute('aria-pressed', x === b)); tone('tap'); }; pal.append(b); });
  const grid = h('div', { class: 'trace-grid' });
  let traced = 0;
  shapes.forEach(sh => {
    const svg = s('svg', { viewBox: '0 0 200 200' });
    const fill = s('path', { d: sh.body, fill: 'transparent' });
    const all = [sh.body, ...sh.extra];
    const guides = all.map(d => s('path', { d, fill: 'none', stroke: '#8F8780', 'stroke-width': 3, 'stroke-dasharray': '7 6', 'stroke-linecap': 'round' }));
    const ink = s('g', { fill: 'none', stroke: '#E5505A', 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    svg.append(fill, ...guides, ink);
    const p0 = guides[0];
    const pct = h('span', { class: 'pct' }, '0%');
    const box = h('div', { class: 'trace' }, h('div', { class: 'ref' }, pic(sh.img, sh.name)), pct, svg);
    grid.append(box);
    // sample points once in the DOM
    let pts = null, hit = null, done = false;
    requestAnimationFrame(() => {
      pts = []; guides.forEach(g => { const L = g.getTotalLength(); for (let l = 0; l < L; l += 5) { const p = g.getPointAtLength(l); pts.push([p.x, p.y]); } });
      hit = new Uint8Array(pts.length);
      const st = p0.getPointAtLength(0); svg.append(s('circle', { cx: st.x, cy: st.y, r: 7, fill: '#2C9A57' }));
    });
    let line = null;
    const toSvg = e => { const m = svg.getScreenCTM().inverse(); const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m); return [p.x, p.y]; };
    svg.addEventListener('pointerdown', e => {
      if (done) { fill.setAttribute('fill', color); tone('tap'); return; }
      svg.setPointerCapture(e.pointerId); const [x, y] = toSvg(e);
      line = s('polyline', { points: x + ',' + y }); ink.append(line); mark(x, y);
    });
    svg.addEventListener('pointermove', e => { if (!line) return; const [x, y] = toSvg(e); line.setAttribute('points', line.getAttribute('points') + ' ' + x + ',' + y); mark(x, y); });
    const end = () => { line = null; };
    svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
    function mark(x, y) {
      if (!pts) return;
      for (let i = 0; i < pts.length; i++) if (!hit[i] && Math.hypot(pts[i][0] - x, pts[i][1] - y) < 13) hit[i] = 1;
      const c = hit.reduce((a, b) => a + b, 0) / pts.length;
      pct.textContent = Math.round(c * 100) + '%';
      if (!done && c > .85) {
        done = true; line = null; pct.textContent = 'Zör!';
        guides.forEach(g => { g.removeAttribute('stroke-dasharray'); g.setAttribute('stroke', '#2E2723'); g.setAttribute('stroke-width', 5); });
        ink.replaceChildren(); svg.style.cursor = 'pointer'; tone('yes');
        if (++traced === shapes.length) api.done();
      }
    }
  });
  act.append(grid, h('div', { class: 'toolbar' }, pal));
  act.append(h('p', { class: 'small-note' }, 'Yaşil nuqtadan boşla. Çiziq tugagach, mevani böyash mumkin.'));
});

/* 11 — patterns */
page(11, 1, 'Naqşni davom ettir. Böş joylarni töğri rangga böya.', 'dasturxonga qoşiq, vilka, qoşiq, vilka qilib qöying.', (act, api) => {
  const rows = [
    { opts: ['024', '025'], out: '028', names: ['qizil barg', 'sariq barg'] },
    { opts: ['032', '033'], out: '036', names: ['qizil olma', 'yaşil olma'] },
    { opts: ['040', '040'], out: '044', names: ['katta anor', 'kiçik anor'], sizes: true }
  ];
  let solved = 0;
  rows.forEach((r, ri) => {
    const cells = h('div', { class: 'cells' });
    const mk = k => { const im = pic(r.opts[k], r.names[k]); if (r.sizes && k === 1) im.classList.add('sm'); return im; };
    for (let i = 0; i < 4; i++) cells.append(h('div', { class: 'cell' }, mk(i % 2)));
    const state = [-1, -1, -1, -1]; const empties = [];
    for (let i = 0; i < 4; i++) {
      const c = h('button', { class: 'cell empty', type: 'button', 'aria-label': 'böş katak ' + (i + 5) }, h('img', { src: IMG(r.out), alt: '', class: 'outline' }));
      c.addEventListener('click', () => {
        if (cells.dataset.ok) return;
        state[i] = state[i] === 0 ? 1 : 0; c.replaceChildren(mk(state[i])); c.classList.remove('bad'); tone('tap');
        if (state.every(v => v >= 0)) {
          const ok = state.every((v, j) => v === j % 2);
          if (ok) { cells.dataset.ok = 1; empties.forEach(e => e.classList.add('right')); tone('yes'); if (++solved === rows.length) api.done(); }
          else state.forEach((v, j) => { if (v !== j % 2) { empties[j].classList.add('bad'); shake(empties[j]); } });
        }
      });
      empties.push(c); cells.append(c);
    }
    act.append(h('div', { class: 'prow' }, h('span', { class: 'num' }, String(ri + 1)), cells));
  });

/* 19 — follow the path */
page(19, 2, 'Har kimni öz yöli böylab olib bor. Yöldan çiqma!', 'un sepilgan patnisda barmoq bilan tölqin çizing.', (act, api) => {
  const W = 600, H = 160;
  const wave = [], steps = [], loops = [];
  for (let i = 0; i <= 300; i++) { const t = i / 300; wave.push([20 + t * 560, 80 - 52 * Math.sin(t * Math.PI * 9 - Math.PI / 2) * -1]); }
  { const pts = [[20, 130]]; let x = 20, y = 130; const seq = [[60, 0], [0, -26], [60, 0], [0, -26], [60, 0], [0, -26], [60, 0], [0, 26], [60, 0], [0, 26], [60, 0], [0, 26], [60, 0]];
    for (const [dx, dy] of seq) { const n = 12; for (let k = 1; k <= n; k++) pts.push([x + dx * k / n, y + dy * k / n]); x += dx; y += dy; }
    const sx = 560 / (x - 20); steps.push(...pts.map(([px, py]) => [20 + (px - 20) * sx, py])); }
  { const a = 20, b = 48, raw = [];
    for (let i = 0; i <= 420; i++) { const t = Math.PI + i / 420 * Math.PI * 6; raw.push([a * t - b * Math.sin(t), 80 - b * Math.cos(t)]); }
    const x0 = raw[0][0], x1 = raw[raw.length - 1][0];
    raw.forEach(([x, y]) => loops.push([20 + (x - x0) / (x1 - x0) * 560, y])); }
  const data = [[wave, '127', 'kapalak', '128', 'gul'], [steps, '129', 'tipratikan', '130', 'olma'], [loops, '131', 'qiz', '132', 'savat']];
  let solved = 0;
  data.forEach(([P, a, an, b, bn]) => {
    const d = 'M' + P.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L');
    const svg = s('svg', { viewBox: `0 0 ${W} ${H}` });
    const road = s('path', { d, fill: 'none', stroke: '#F3E2CC', 'stroke-width': 30, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    const dash = s('path', { d, fill: 'none', stroke: '#8F8780', 'stroke-width': 2.5, 'stroke-dasharray': '8 7' });
    const trail = s('polyline', { fill: 'none', stroke: '#E5505A', 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', points: '' });
    const goal = s('circle', { cx: P[P.length - 1][0], cy: P[P.length - 1][1], r: 9, fill: '#E5505A' });
    const tok = s('g', {}, s('circle', { r: 17, fill: '#2C9A57', stroke: '#fff', 'stroke-width': 4 }));
    svg.append(road, dash, trail, goal, tok);
    let idx = 0, drag = false;
    const place = () => { tok.setAttribute('transform', `translate(${P[idx][0]} ${P[idx][1]})`); trail.setAttribute('points', P.slice(0, idx + 1).map(p => p.join(',')).join(' ')); };
    place();
    const toSvg = e => { const m = svg.getScreenCTM().inverse(); const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m); return [p.x, p.y]; };
    const row = h('div', { class: 'pathrow' }, pic(a, an), svg, h('div', { class: 'end' }, pic(b, bn)));
    svg.addEventListener('pointerdown', e => { if (row.dataset.ok) return; const [x, y] = toSvg(e); if (Math.hypot(x - P[idx][0], y - P[idx][1]) < 40) { drag = true; svg.setPointerCapture(e.pointerId); tone('tap'); } });
    svg.addEventListener('pointermove', e => {
      if (!drag) return; const [x, y] = toSvg(e);
      let best = -1, bd = 1e9;
      for (let j = idx; j < Math.min(P.length, idx + 30); j++) { const dd = Math.hypot(P[j][0] - x, P[j][1] - y); if (dd < bd) { bd = dd; best = j; } }
      if (bd < 24) { idx = best; place(); if (idx >= P.length - 2) { drag = false; row.dataset.ok = 1; row.classList.add('done'); tone('yes'); if (++solved === data.length) api.done(); } }
      else if (bd > 40) { drag = false; shake(svg); tone('no'); }
    });
    const up = () => { drag = false; };
    svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
    act.append(row);
  });
  act.append(h('p', { class: 'small-note' }, 'Yaşil doiraçani barmoq bilan bosib, yöl böylab qizil nuqtagaça surib bor.'));
});

/* 21 — maze */
page(21, 2, 'Tipratikanni olmaga olib bor. Yaşil nuqtadan boşlab yöl çiz, devordan ötma!', 'xonada stul va yostiqlardan yöl qurib, öyinçoqni «labirint»dan olib öting.', (act, api) => {
  const N = 6, C = 70, O = 60;
  const V = new Set(['0,0', '1,1', '2,1', '1,2', '2,2', '2,4', '3,3', '2,0', '3,0', '4,2']); // wall right of cell r,c
  const Hh = new Set(['0,1', '0,4', '0,5', '1,0', '1,3', '1,4', '2,2', '3,1', '3,2', '3,3', '3,4', '4,1', '4,2', '4,4', '4,5']); // wall below r,c
  const open = (r, c, dr, dc) => {
    const r2 = r + dr, c2 = c + dc; if (r2 < 0 || c2 < 0 || r2 >= N || c2 >= N) return false;
    if (dc === 1) return !V.has(r + ',' + c); if (dc === -1) return !V.has(r + ',' + c2);
    if (dr === 1) return !Hh.has(r + ',' + c); return !Hh.has(r2 + ',' + c);
  };
  const svg = s('svg', { viewBox: `0 0 ${N * C + O * 2} ${N * C + O * 2}` });
  svg.append(s('rect', { x: O, y: O, width: N * C, height: N * C, fill: '#F6E6D4' }));
  const wall = (x1, y1, x2, y2) => svg.append(s('line', { x1: O + x1 * C, y1: O + y1 * C, x2: O + x2 * C, y2: O + y2 * C, stroke: '#C8424C', 'stroke-width': 6, 'stroke-linecap': 'round' }));
  wall(0, 0, N, 0); wall(0, N, N, N); wall(0, 1, 0, N); wall(N, 0, N, N - 1);
  V.forEach(k => { const [r, c] = k.split(',').map(Number); wall(c + 1, r, c + 1, r + 1); });
  Hh.forEach(k => { const [r, c] = k.split(',').map(Number); wall(c, r + 1, c + 1, r + 1); });
  const ctr = (r, c) => [O + c * C + C / 2, O + r * C + C / 2];
  const trail = s('polyline', { fill: 'none', stroke: '#2C9A57', 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .7 });
  svg.append(trail, s('circle', { cx: O - 18, cy: O + C / 2, r: 10, fill: '#2C9A57' }));
  svg.append(s('image', { href: IMG('146'), x: O + N * C + 4, y: O + (N - 1) * C + 8, width: 54, height: 54 }));
  const hog = s('image', { href: IMG('145'), width: 58, height: 58 }); svg.append(hog);
  let r = 0, c = 0, path = [[0, 0]], won = false;
  const draw = () => { const [x, y] = ctr(r, c); hog.setAttribute('x', x - 29); hog.setAttribute('y', y - 29); trail.setAttribute('points', [[O - 18, O + C / 2], ...path.map(([a, b]) => ctr(a, b))].map(p => p.join(',')).join(' ')); };
  function move(dr, dc) {
    if (won) return;
    if (!open(r, c, dr, dc)) { shake(svg); tone('no'); return; }
    r += dr; c += dc;
    const prev = path[path.length - 2]; if (prev && prev[0] === r && prev[1] === c) path.pop(); else path.push([r, c]);
    tone('tap'); draw();

/* flood-fill colouring helper (p24, p28) */
function colorCanvas(src, colors, onFill) {
  const cv = h('canvas', { 'aria-label': 'Böyaladigan rasm' }); const ctx = cv.getContext('2d', { willReadFrequently: true });
  let color = colors[0]; const undo = [];
  const im = new Image(); im.onload = () => { cv.width = im.naturalWidth; cv.height = im.naturalHeight; ctx.drawImage(im, 0, 0); }; im.src = src;
  const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  cv.addEventListener('click', e => {
    const b = cv.getBoundingClientRect(); const x = Math.floor((e.clientX - b.left) / b.width * cv.width), y = Math.floor((e.clientY - b.top) / b.height * cv.height);
    const W = cv.width, H = cv.height; const img = ctx.getImageData(0, 0, W, H), d = img.data;
    const i0 = (y * W + x) * 4; const sr = d[i0], sg = d[i0 + 1], sb = d[i0 + 2];
    if (sr + sg + sb < 200) return; // tapped a line
    const [cr, cg, cb] = hex(color); if (Math.abs(sr - cr) + Math.abs(sg - cg) + Math.abs(sb - cb) < 10) return;
    undo.push(ctx.getImageData(0, 0, W, H)); if (undo.length > 12) undo.shift();
    const same = i => Math.abs(d[i] - sr) + Math.abs(d[i + 1] - sg) + Math.abs(d[i + 2] - sb) < 60;
    const seen = new Uint8Array(W * H); const st = [x, y];
    while (st.length) {
      const yy = st.pop(), xx = st.pop(); let lx = xx;
      while (lx >= 0 && !seen[yy * W + lx] && same((yy * W + lx) * 4)) lx--;
      lx++; let up = false, dn = false;
      for (let cx = lx; cx < W; cx++) {
        const p = yy * W + cx; if (seen[p] || !same(p * 4)) break;
        seen[p] = 1; d[p * 4] = cr; d[p * 4 + 1] = cg; d[p * 4 + 2] = cb;
        if (yy > 0) { const q = p - W; const ok = !seen[q] && same(q * 4); if (ok && !up) { st.push(cx, yy - 1); up = true; } else if (!ok) up = false; }
        if (yy < H - 1) { const q = p + W; const ok = !seen[q] && same(q * 4); if (ok && !dn) { st.push(cx, yy + 1); dn = true; } else if (!ok) dn = false; }
      }
    }
    ctx.putImageData(img, 0, 0); tone('tap'); onFill && onFill();
  });
  const pal = h('div', { class: 'palette' });
  colors.forEach((c, i) => { const b = h('button', { class: 'swatch', type: 'button', 'aria-label': 'rang ' + (i + 1), 'aria-pressed': i === 0 ? 'true' : 'false' }); b.style.background = c; b.onclick = () => { color = c; pal.querySelectorAll('.swatch').forEach(x => x.setAttribute('aria-pressed', x === b)); }; pal.append(b); });
  const tools = h('div', { class: 'toolbar' }, pal,
    h('button', { class: 'btn small', type: 'button', onclick: () => { const u = undo.pop(); if (u) ctx.putImageData(u, 0, 0); } }, '↶ Orqaga'),
    h('button', { class: 'btn small', type: 'button', onclick: () => { undo.length = 0; ctx.clearRect(0, 0, cv.width, cv.height); ctx.drawImage(im, 0, 0); } }, 'Tozalash'));
  return { cv, tools };
}

    b.onclick = () => { moods[p.n] = moods[p.n] === lab ? null : lab; store.set('moods', moods); mood.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b && moods[p.n] === lab)); };
    mood.append(b);
  });
  sheet.replaceChildren(
    h('div', { class: 'sheet-head' }, h('div', { class: 'pnum' }, String(p.n)), h('div', { class: 'task' }, p.n === 27 ? h('span', { class: 'badge' }, 'Zukko sinov') : p.n === 28 ? h('span', { class: 'badge' }, 'Darvoza') : null, h('h2', {}, p.title)), diff),
    act, win, hint || '',
    h('div', { class: 'foot' }, h('div', { class: 'together' }, h('b', {}, 'Birga öynaymiz: '), p.tip), mood)
  );
  p.build(act, api);
  $('#prev').disabled = cur === 0; $('#next').disabled = cur === PAGES.length - 1; $('#next').classList.remove('pulse');
  paintTabs();
  tabs.children[cur].scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  if (push) { try { history.replaceState(null, '', '#p' + p.n); } catch { location.hash = 'p' + p.n; } window.scrollTo({ top: 0 }); }
}
$('#prev').onclick = () => go(cur - 1);
$('#next').onclick = () => go(cur + 1);
const sb = $('#soundBtn');
const paintSound = () => { sb.innerHTML = soundOn ? SPK_ON : SPK_OFF; sb.setAttribute('aria-pressed', soundOn); sb.setAttribute('aria-label', soundOn ? 'Ovozni öçirish' : 'Ovozni yoqiş'); };
sb.onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); paintSound(); tone('tap'); };
paintSound();
const fromHash = () => { const m = /^#p(\d+)$/.exec(location.hash); const i = m ? PAGES.findIndex(p => p.n === +m[1]) : -1; return i; };
window.addEventListener('hashchange', () => { const i = fromHash(); if (i >= 0 && i !== cur) go(i, false); });
const start = fromHash(); go(start >= 0 ? start : 0, false);
})();
