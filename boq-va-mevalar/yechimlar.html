<title>Boğ va mevalar: yechimlar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: a garden trail map on top (21 stepping stones = 21 pages), the hedgehog guide narrates,
   and the solution plays step by step on a workbook sheet below. Single light look: art is on white paper. */
:root{
  --paper:#FBF7EE;
  --sheet:#FFFFFF;
  --ink:#2E2723;
  --muted:#76685E;
  --coral:#E5505A;
  --coral-deep:#B9363F;
  --orange:#F2922E;
  --leaf:#4F8A3C;
  --leaf-deep:#2F5E25;
  --soil:#E9D3B4;
  --cream:#FFF2E0;
  --line:#EDDDCB;
  --ok:#2C9A57;
  --ok-soft:#E2F4E8;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Andika','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--leaf-deep)}
button{font:inherit;color:inherit}
img{max-width:100%;display:block;user-select:none;-webkit-user-drag:none}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1060px;margin:0 auto}

/* hero: garden trail */
.hero{background:linear-gradient(#3F7A33,#4F8A3C 70%,#5C9A47);color:#fff;padding-block:14px 8px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:18px;background:radial-gradient(circle at 12px 18px,var(--paper) 12px,transparent 13px) 0 0/24px 18px repeat-x}
.hero .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.kicker{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.85}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.05;margin:2px 0 0;text-wrap:balance}
.hero h1 em{font-style:normal;color:#FFD866}
.legend{font-size:.9rem;opacity:.9;max-width:42ch}
.trail{overflow-x:auto;margin-top:6px;padding-bottom:16px;scrollbar-width:thin}
.trail svg{display:block;min-width:820px;width:100%;height:auto}
.stone{cursor:pointer}
.stone circle.base{fill:#F7EBD6;stroke:#C9A67A;stroke-width:3;transition:fill .25s}
.stone text{font-family:var(--display);font-weight:800;font-size:19px;fill:#6B4E2E;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.stone.seen circle.base{fill:#FFE4A8}
.stone.cur circle.base{fill:var(--coral);stroke:#fff}
.stone.cur text{fill:#fff}
.stone:hover circle.base{stroke:#fff}
.stone:focus-visible{outline:none}
.stone:focus-visible circle.base{stroke:#FFD866;stroke-width:5}
#guide{transition:transform .7s cubic-bezier(.5,0,.3,1)}

main{padding-block:16px 40px}
.sheet{background:var(--sheet);border-radius:22px;box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgba(60,80,30,.35);padding:18px clamp(14px,3vw,28px) 22px}
.head{display:flex;gap:14px;align-items:flex-start}
.pnum{flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.5rem;box-shadow:0 0 0 5px #fff,0 0 0 7px var(--cream)}
.head .t{flex:1;min-width:0}
.head h2{font-family:var(--display);font-weight:700;font-size:clamp(1.1rem,2.3vw,1.4rem);line-height:1.25;margin:0;text-wrap:balance}
.answer{display:inline-flex;align-items:center;gap:6px;margin-top:6px;background:var(--ok-soft);color:#1E6B3D;border-radius:999px;padding:3px 12px;font-weight:700;font-size:.95rem}
.answer[hidden]{display:none!important}
.answer b{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-size:.78rem}

/* narrator */
.narr{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center;margin-top:16px}
.narr img{width:76px;transform:scaleX(-1)}
.bubble{background:#FFF8E1;border:2px solid #EFCF6E;border-radius:18px;padding:10px 14px;position:relative;min-height:62px;display:flex;flex-direction:column;justify-content:center}
.bubble::before{content:"";position:absolute;left:-11px;top:50%;margin-top:-9px;border:9px solid transparent;border-right:11px solid #EFCF6E;border-left:0}
.bubble::after{content:"";position:absolute;left:-8px;top:50%;margin-top:-7px;border:7px solid transparent;border-right:9px solid #FFF8E1;border-left:0}
.bubble .cnt{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bubble .say{font-weight:700;font-size:1.05rem}
.bubble .say.flash{animation:pop .4s}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{border:0;border-radius:999px;padding:9px 18px;font-family:var(--display);font-weight:700;font-size:1.02rem;cursor:pointer;background:var(--cream);color:var(--coral-deep);display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--coral);color:#fff;min-width:150px;justify-content:center}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:18px;height:18px}
.pips{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.pips i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--orange)}
.stage{margin-top:18px}

/* shared solution visuals */
.card{background:#fff;border:2px solid var(--line);border-radius:14px;display:grid;place-items:center;position:relative;padding:6px}
.card img{width:100%;height:100%;object-fit:contain}
.good{border-color:var(--ok)!important;box-shadow:0 0 0 4px rgba(44,154,87,.18);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.dim{opacity:.35;transition:opacity .4s}
.ring::after{content:"";position:absolute;inset:-7px;border:4px solid var(--coral);border-radius:50%;pointer-events:none;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.xmark::after{content:"";position:absolute;inset:10%;pointer-events:none;animation:pop .35s;
  background:linear-gradient(45deg,transparent 45%,var(--coral) 45%,var(--coral) 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,var(--coral) 45%,var(--coral) 55%,transparent 55%)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.dot{width:16px;height:16px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px #fff;flex:0 0 auto}
.rel{position:relative}
.wires{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:2}
.wires line{stroke:var(--coral);stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.wires line.anim{animation:draw .8s ease-out backwards}
@keyframes draw{from{stroke-dashoffset:1}}
.num{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.95rem}
.tag{position:absolute;transform:translate(-50%,-50%);background:var(--coral);color:#fff;font-family:var(--display);font-weight:800;border-radius:999px;padding:0 10px;font-size:.95rem;white-space:nowrap;animation:pop .4s backwards;box-shadow:0 2px 0 rgba(0,0,0,.15);z-index:3;pointer-events:none}
.tag.round{width:30px;height:30px;padding:0;display:grid;place-items:center}
.mark{position:absolute;width:12%;aspect-ratio:1;border:4px solid var(--coral);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:pop .45s cubic-bezier(.2,1.6,.4,1);box-shadow:0 0 0 3px rgba(255,255,255,.85)}
.say-box{background:#fff;border:2px solid #D9D2CC;border-radius:16px;padding:8px 14px;font-weight:700;animation:pop .4s}
.instant *,.instant *::after,.instant *::before{animation:none!important;transition:none!important}

/* p8 */
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:14px;align-items:start}
.scene{position:relative;border-radius:16px;overflow:hidden;border:3px solid #F0C86A}
.scene img{width:100%}
.seek{display:flex;flex-direction:column;gap:8px}
.si{display:flex;align-items:center;gap:6px;border:2px solid #F0A3A8;border-radius:12px;padding:4px 6px;background:#fff}
.si img{width:52px;height:52px;object-fit:contain}
.si .tk{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center}
.si.found{border-color:var(--ok);background:var(--ok-soft)}
.si.found .tk{background:var(--ok);border-color:var(--ok);animation:pop .4s}
.si.found .tk::after{content:"";width:9px;height:5px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
@media (max-width:640px){.hgrid{grid-template-columns:1fr}.seek{flex-direction:row;flex-wrap:wrap;order:-1}.si{flex:1 1 calc(25% - 8px);justify-content:center}.si img{width:38px;height:38px}}

/* columns */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px clamp(60px,18vw,220px);max-width:560px;margin:0 auto}
.cols .card{width:100%;max-width:110px;aspect-ratio:1}
.cols .l{justify-self:start;display:flex;align-items:center;gap:12px}
.cols .r{justify-self:end;display:flex;align-items:center;gap:12px}

/* p10 */
.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tr{background:var(--cream);border:2px solid #F3D9BA;border-radius:16px;padding:6px;position:relative}
.tr .ref{position:absolute;left:8px;top:8px;width:44px;height:44px;background:#fff;border-radius:10px;padding:3px;border:2px solid var(--line)}
.tr svg{width:100%;height:auto;display:block}
.tr .ink{stroke-dasharray:1;stroke-dashoffset:0}
.tr .ink.anim{animation:draw 1.6s ease-in-out backwards}
.tr .fill{transition:fill .6s .9s}
@media (max-width:620px){.tgrid{grid-template-columns:1fr 1fr}}

/* p11 */
.prow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cells{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;flex:1;min-width:0}
.cell{aspect-ratio:1;border:2px solid var(--line);border-radius:10px;display:grid;place-items:center;padding:4px;background:#fff;position:relative}
.cell img{width:100%;height:100%;object-fit:contain}
.cell .sm{width:58%;height:58%}
.cell.empty{border-color:#9C918A}
.cell.empty img.o{opacity:.45}
.cell .pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) backwards}
@media (max-width:560px){.cells{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* p12 */
.frow{display:flex;justify-content:center;gap:10px;flex-wrap:nowrap}
.fr{display:flex;flex-direction:column;align-items:center;gap:8px}
.fr .card{width:min(80px,15vw);aspect-ratio:1}
.baskets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:36px auto;max-width:600px}
.basket{display:flex;flex-direction:column;align-items:center;gap:6px}
.basket .b{width:min(140px,24vw)}
.sign{width:60px;height:60px;border:3px solid var(--coral);border-radius:50%;padding:7px;background:#fff}
.bc{font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--coral-deep);min-height:1.5em}
.bc span{animation:pop .4s backwards}

/* p13 */
.cut{display:grid;grid-template-columns:minmax(0,1.1fr) 40px repeat(3,minmax(0,1fr));gap:10px;align-items:center;background:var(--cream);border:2px solid #F3D9BA;border-radius:16px;padding:10px;margin-bottom:10px}
.cut .card{aspect-ratio:1}
.arrow{height:4px;background:var(--coral);border-radius:2px;position:relative}
.arrow::after{content:"";position:absolute;right:-2px;top:-5px;border:7px solid transparent;border-left:10px solid var(--coral);border-right:0}
.cut.hl{box-shadow:0 0 0 4px #FFD866}
@media (max-width:480px){.cut{grid-template-columns:minmax(0,1fr) 16px repeat(3,minmax(0,1fr));gap:6px}}

/* p14 */
.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.four .card{aspect-ratio:3/4;padding:0;overflow:hidden}
.four .card img{object-fit:cover}
.four .tool{aspect-ratio:1;padding:10px}
.cw{display:flex;flex-direction:column;align-items:center;gap:8px}
.gapv{height:clamp(50px,10vw,90px)}
.lines{display:flex;flex-direction:column;gap:8px;margin-top:14px;align-items:flex-start}

/* p15 */
.cg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.cb{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 4px;border-radius:14px;position:relative}
.cb img{width:100%;max-width:150px}
.circ,.nums{display:flex;gap:3px;border:2px solid var(--line);border-radius:999px;padding:4px 6px;background:#fff}
.circ i{width:clamp(13px,2.8vw,20px);aspect-ratio:1;border-radius:50%;border:2px solid var(--ink)}
.circ i.on{background:var(--coral);border-color:var(--coral-deep);animation:pop .3s backwards}
.nums{background:#FFF4E6}
.nums span{font-family:var(--display);font-weight:700;width:clamp(16px,3.2vw,24px);aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:clamp(.85rem,2vw,1.05rem)}
.nums span.on{box-shadow:inset 0 0 0 2.5px var(--coral);color:var(--coral-deep);animation:pop .4s backwards}
.cb.best{background:var(--ok-soft)}
.cb.least{background:#FDE7E3}
.cb .lbl{font-family:var(--display);font-weight:800;font-size:.9rem;color:var(--coral-deep);animation:pop .4s}
@media (max-width:620px){.cg{grid-template-columns:1fr}.cb{flex-direction:row;flex-wrap:wrap;justify-content:center}.cb img{max-width:100px}}

/* p16 */
.tg{display:flex;flex-direction:column;align-items:center;gap:28px}
.tgt{display:flex;flex-direction:column;align-items:center;gap:10px}
.tgt .im{display:flex;align-items:center;gap:12px}
.tgt img{width:min(190px,38vw)}
.tgt.wide img{width:min(290px,58vw)}
.tgt .lab{font-family:var(--display);font-weight:800;letter-spacing:.12em;color:var(--muted)}
.six{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;width:100%;max-width:640px}
.six .card{aspect-ratio:1;width:100%}

/* p17 */
.shelf{background:var(--cream);border:2px solid #F3D9BA;border-radius:18px;padding:12px;margin-bottom:12px}
.shelf h3{margin:0 0 6px;font-family:var(--display);font-size:1.05rem}
.shelf .rel img{border-radius:10px}
.opts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.opts .card{width:92px;aspect-ratio:1}

/* rows */
.irow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.items{display:grid;gap:8px;flex:1;min-width:0}
.items .card{aspect-ratio:1}
.why{font-size:.9rem;color:var(--muted);margin:-6px 0 12px 36px;animation:pop .4s}

/* p19 */
.prw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,5fr) minmax(0,1fr);align-items:center;gap:6px;margin-bottom:14px}
.prw svg{width:100%;height:auto;display:block}

/* p20 */
.prep{display:grid;grid-template-columns:minmax(0,1.1fr) repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
.phr{background:var(--cream);border:2px solid #F3D9BA;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-family:var(--display);font-weight:700;font-size:1.1rem;position:relative}
.phr em{font-style:normal;color:var(--coral)}
.phr .num{position:absolute;left:8px;top:8px}
.prep .card{aspect-ratio:4/5;padding:0}
.prep .card img{object-fit:cover;border-radius:12px}

/* p21 */
.maze svg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}

/* p22 */
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.three .card{aspect-ratio:1;padding:0}
.three .card img{object-fit:cover;border-radius:12px}
.three .num{position:absolute;left:8px;top:8px;z-index:1}
.ends{background:var(--cream);border:2px solid #F3D9BA;border-radius:18px;padding:12px;margin-top:14px}
.ends h3{text-align:center;margin:0 0 10px;font-family:var(--display)}
.cap{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(255,255,255,.92);border-radius:10px;padding:4px 8px;font-size:.85rem;font-weight:700;animation:pop .4s backwards}

/* p24/p28 */
.canvas-wrap{position:relative;max-width:560px;margin:0 auto}
.canvas-wrap canvas{width:100%;height:auto;display:block;border:3px solid #F0C86A;border-radius:16px;background:#fff}
.canvas-wrap.wide{max-width:none}
.pick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:12px}
.pick .card{aspect-ratio:1}
@media (max-width:520px){.pick{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* p25 */
.spot{display:grid;gap:12px}
.spot .scene .mark{width:11%}

/* p26 */
.drow{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1.4fr);gap:12px;align-items:center;background:var(--cream);border:2px solid #F3D9BA;border-radius:18px;padding:12px;margin-bottom:12px;position:relative}
.drow .numtag{position:absolute;left:10px;top:10px}
.drow figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.drow figcaption{font-family:var(--display);font-weight:700;color:var(--muted)}
.drow svg{width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)}
.drow figure svg{max-width:190px}
.drow .user svg{max-width:280px;margin:0 auto;border-color:#8D847E}
.drow .arrow{background:#999}.drow .arrow::after{border-left-color:#999}
.seg{stroke-dasharray:1;stroke-dashoffset:0}
.seg.anim{animation:draw .5s ease-out backwards}

/* p27 */
.test{background:var(--cream);border:2px solid #F3D9BA;border-radius:18px;padding:12px 14px;margin-bottom:12px}
.test h3{margin:0 0 10px;display:flex;align-items:center;gap:8px;font-size:1.02rem}
.rowi{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.test .card{width:min(72px,14vw);aspect-ratio:3/4}
.q{border:3px dashed #A99F98;border-radius:14px;width:min(72px,14vw);aspect-ratio:3/4;display:grid;place-items:center;font-family:var(--display);font-size:2rem;color:#A99F98;background:#fff;padding:6px}
.q img{width:100%;height:100%;object-fit:contain;animation:pop .45s}
.vbar{width:2px;align-self:stretch;background:#8A807A;margin:0 6px}

/* answer key */
.key{margin-top:26px}
.key h2{font-family:var(--display);font-size:1.4rem;margin:0 0 4px}
.key p{margin:0 0 12px;color:var(--muted)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.kc{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:start;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px;cursor:pointer}
.kc:hover{border-color:#C9DDBE}
.kc .n{width:40px;height:40px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.1rem}
.kc .a{font-size:.92rem}
.kc .a b{display:block;font-size:.8rem;color:var(--muted);font-weight:700}
@media (max-width:560px){.narr{grid-template-columns:52px minmax(0,1fr)}.narr img{width:52px}.ctrl .btn{padding:8px 12px}.btn.primary{min-width:0;flex:1}#all{order:5}.pips{order:6;margin-left:auto}}
@media (prefers-reduced-motion:reduce){*,*::after,*::before{animation:none!important;transition:none!important}}
</style>

<header class="hero gut">
  <div class="in">
    <div class="top">
      <div>
        <div class="kicker">IDC Kids · 3–4 yosh · 1-bob</div>
        <h1>Boğ va mevalar: <em>yechimlar yöli</em></h1>
      </div>
      <p class="legend">Toşni tanla, keyin «Yechimni körsat» tugmasini bos. Tipratikan har bir betni qadamma-qadam tuşuntirib beradi.</p>
    </div>
    <div class="trail" id="trail"></div>
  </div>
</header>

<main class="gut">
  <div class="in">
    <article class="sheet">
      <div class="head">
        <div class="pnum" id="pnum">8</div>
        <div class="t">
          <h2 id="ptitle"></h2>
          <div class="answer" id="answer" hidden><b>Javob</b><span id="answerText"></span></div>
        </div>
      </div>
      <div class="narr">
        <img src="img/145.webp" alt="Tipratikan">
        <div class="bubble" aria-live="polite">
          <span class="cnt" id="cnt"></span>
          <span class="say" id="say"></span>
        </div>
      </div>
      <div class="ctrl">

<script>
(() => {
'use strict';
const IMG = id => 'img/' + id + (/\.(png|webp)$/.test(id) ? '' : '.webp');
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k === 'class') n.className = v; else if (k === 'html') n.innerHTML = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v); }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
function s(tag, attrs, ...kids) { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs || {})) if (v != null) n.setAttribute(k, v); for (const c of kids.flat()) if (c) n.append(c); return n; }
const pic = (id, alt = '') => h('img', { src: IMG(id), alt, draggable: 'false' });
const card = (id, alt = '', cls = '') => h('div', { class: 'card ' + cls }, pic(id, alt));
const stagger = (els, gap = .15) => els.forEach((e, i) => e.style.animationDelay = (i * gap) + 's');
let INSTANT = false;

/* lines between DOM nodes */
function wires(root) {
  const svg = s('svg', { class: 'wires' }); root.append(svg);
  const links = []; let lw = 0, lh = 0;
  const pt = n => { const r = n.getBoundingClientRect(), R = root.getBoundingClientRect(); return [r.left + r.width / 2 - R.left, r.top + r.height / 2 - R.top]; };
  function draw(fresh) {
    svg.replaceChildren(); lw = root.clientWidth; lh = root.clientHeight;
    links.forEach((l, i) => { const [x1, y1] = pt(l[0]), [x2, y2] = pt(l[1]); const ln = s('line', { x1, y1, x2, y2, pathLength: 1 }); if (fresh && fresh.includes(i) && !INSTANT) { ln.classList.add('anim'); ln.style.animationDelay = (fresh.indexOf(i) * .25) + 's'; } svg.append(ln); });
  }
  new ResizeObserver(() => { if (root.clientWidth !== lw || root.clientHeight !== lh) draw(); }).observe(root);
  return { add(pairs) { const start = links.length; pairs.forEach(p => links.push(p)); draw(pairs.map((_, k) => start + k)); } };
}
const tag = (box, x, y, text, round) => { const t = h('span', { class: 'tag' + (round ? ' round' : '') }, text); t.style.left = x + '%'; t.style.top = y + '%'; box.append(t); return t; };
const mark = (box, x, y) => { const m = h('span', { class: 'mark' }); m.style.left = x + '%'; m.style.top = y + '%'; box.append(m); return m; };
function animate(dur, fn) { if (INSTANT) { fn(1); return; } const t0 = performance.now(); const tick = now => { const p = Math.min(1, (now - t0) / dur); fn(p); if (p < 1 && !cancelled()) requestAnimationFrame(tick); }; const tok = runTok; const cancelled = () => tok !== runTok; requestAnimationFrame(tick); }
let runTok = 0;

/* flood-fill canvas */
function fillCanvas(src) {
  const cv = h('canvas'); const ctx = cv.getContext('2d', { willReadFrequently: true });
  const ready = new Promise(res => { const im = new Image(); im.onload = () => { cv.width = im.naturalWidth; cv.height = im.naturalHeight; ctx.drawImage(im, 0, 0); res(); }; im.src = src; });
  function fill(px, py, color) {
    const W = cv.width, H = cv.height, x = Math.floor(px / 100 * W), y = Math.floor(py / 100 * H);
    const img = ctx.getImageData(0, 0, W, H), d = img.data, i0 = (y * W + x) * 4;
    const sr = d[i0], sg = d[i0 + 1], sb = d[i0 + 2]; if (sr + sg + sb < 200) return;
    const c = [parseInt(color.slice(1, 3), 16), parseInt(color.slice(3, 5), 16), parseInt(color.slice(5, 7), 16)];
    const same = i => Math.abs(d[i] - sr) + Math.abs(d[i + 1] - sg) + Math.abs(d[i + 2] - sb) < 60;
    const seen = new Uint8Array(W * H), st = [x, y];
    while (st.length) { const yy = st.pop(), xx = st.pop(); let lx = xx; while (lx >= 0 && !seen[yy * W + lx] && same((yy * W + lx) * 4)) lx--; lx++; let up = false, dn = false;
      for (let cx = lx; cx < W; cx++) { const p = yy * W + cx; if (seen[p] || !same(p * 4)) break; seen[p] = 1; d[p * 4] = c[0]; d[p * 4 + 1] = c[1]; d[p * 4 + 2] = c[2];
        if (yy > 0) { const q = p - W, ok = !seen[q] && same(q * 4); if (ok && !up) { st.push(cx, yy - 1); up = true; } else if (!ok) up = false; }
        if (yy < H - 1) { const q = p + W, ok = !seen[q] && same(q * 4); if (ok && !dn) { st.push(cx, yy + 1); dn = true; } else if (!ok) dn = false; } } }
    ctx.putImageData(img, 0, 0);
  }
  return { cv, ctx, ready, fill };
}

/* ---------------- solutions ---------------- */
const P = [];
const add = (n, title, answer, setup) => P.push({ n, title, answer, setup });

add(19, 'Har kimni öz yöli böylab olib bor. Yöldan çiqma!', 'kapalak→gul · tipratikan→olma · qiz→savat', st => {
  const wave = [], steps = [], loops = [];
  for (let i = 0; i <= 300; i++) { const t = i / 300; wave.push([20 + t * 560, 80 + 52 * Math.sin(t * Math.PI * 9 - Math.PI / 2)]); }
  { let x = 20, y = 130; const pts = [[x, y]]; for (const [dx, dy] of [[60, 0], [0, -26], [60, 0], [0, -26], [60, 0], [0, -26], [60, 0], [0, 26], [60, 0], [0, 26], [60, 0], [0, 26], [60, 0]]) { for (let k = 1; k <= 12; k++) pts.push([x + dx * k / 12, y + dy * k / 12]); x += dx; y += dy; } const sx = 560 / (x - 20); pts.forEach(([px, py]) => steps.push([20 + (px - 20) * sx, py])); }
  { const raw = []; for (let i = 0; i <= 420; i++) { const t = Math.PI + i / 420 * Math.PI * 6; raw.push([20 * t - 48 * Math.sin(t), 80 - 48 * Math.cos(t)]); } const x0 = raw[0][0], x1 = raw[raw.length - 1][0]; raw.forEach(([x, y]) => loops.push([20 + (x - x0) / (x1 - x0) * 560, y])); }
  const D = [[wave, '127', '128', 'Kapalak tölqin böylab: tepaga, pastga, tepaga, pastga... gulgaça.'], [steps, '129', '130', 'Tipratikan zinapoya böylab: uç poğona tepaga, uç poğona pastga — olmaga yetdi!'], [loops, '131', '132', 'Qiz halqaçalar böylab: har bir halqani aylanib öt, keyin savatga yet.']];
  const R = D.map(([pts, a, b]) => {
    const d = 'M' + pts.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L');
    const trail = s('polyline', { fill: 'none', stroke: '#E5505A', 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    const tok = s('circle', { r: 15, fill: '#2C9A57', stroke: '#fff', 'stroke-width': 4, cx: pts[0][0], cy: pts[0][1] });
    const svg = s('svg', { viewBox: '0 0 600 160' }, s('path', { d, fill: 'none', stroke: '#F3E2CC', 'stroke-width': 30, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }), s('path', { d, fill: 'none', stroke: '#8F8780', 'stroke-width': 2.5, 'stroke-dasharray': '8 7' }), trail, s('circle', { cx: pts[pts.length - 1][0], cy: pts[pts.length - 1][1], r: 9, fill: '#E5505A' }), tok);
    st.append(h('div', { class: 'prw' }, pic(a), svg, pic(b)));
    return () => animate(2600, p => { const k = Math.round(p * (pts.length - 1)); trail.setAttribute('points', pts.slice(0, k + 1).map(q => q.join(',')).join(' ')); tok.setAttribute('cx', pts[k][0]); tok.setAttribute('cy', pts[k][1]); });
  });
  return D.map(([, , , t], i) => [t, R[i]]);
});

add(21, 'Tipratikanni olmaga olib bor. Yaşil nuqtadan boşlab yöl çiz, devordan ötma!', 'pastga → öngga → tepaga → öngga → pastga → çapga → pastga → öngga', st => {
  const N = 6, C = 70, O = 60;
  const V = ['0,0', '1,1', '2,1', '1,2', '2,2', '2,4', '3,3', '2,0', '3,0', '4,2'], Hh = ['0,1', '0,4', '0,5', '1,0', '1,3', '1,4', '2,2', '3,1', '3,2', '3,3', '3,4', '4,1', '4,2', '4,4', '4,5'];
  const svg = s('svg', { viewBox: `0 0 ${N * C + O * 2} ${N * C + O * 2}` }); svg.append(s('rect', { x: O, y: O, width: N * C, height: N * C, fill: '#F6E6D4' }));
  const wall = (a, b, c, d) => svg.append(s('line', { x1: O + a * C, y1: O + b * C, x2: O + c * C, y2: O + d * C, stroke: '#C8424C', 'stroke-width': 6, 'stroke-linecap': 'round' }));
  wall(0, 0, N, 0); wall(0, N, N, N); wall(0, 1, 0, N); wall(N, 0, N, N - 1);
  V.forEach(k => { const [r, c] = k.split(',').map(Number); wall(c + 1, r, c + 1, r + 1); }); Hh.forEach(k => { const [r, c] = k.split(',').map(Number); wall(c, r + 1, c + 1, r + 1); });
  const ctr = ([r, c]) => [O + c * C + C / 2, O + r * C + C / 2];
  const path = [[0, 0], [1, 0], [1, 1], [2, 1], [3, 1], [3, 2], [3, 3], [2, 3], [2, 4], [3, 4], [3, 5], [4, 5], [4, 4], [4, 3], [5, 3], [5, 4], [5, 5]];
  const pts = [[O - 18, O + C / 2], ...path.map(ctr), [O + N * C + 20, O + (N - 1) * C + C / 2]];
  const trail = s('polyline', { fill: 'none', stroke: '#2C9A57', 'stroke-width': 9, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .75 });
  const hog = s('image', { href: IMG('145'), width: 58, height: 58, x: pts[0][0] - 29, y: pts[0][1] - 29 });
  svg.append(trail, s('circle', { cx: O - 18, cy: O + C / 2, r: 10, fill: '#2C9A57' }), s('image', { href: IMG('146'), x: O + N * C + 4, y: O + (N - 1) * C + 8, width: 54, height: 54 }), hog);
  st.append(h('div', { class: 'maze' }, svg));
  const seg = (from, to) => () => animate((to - from) * 260, p => { const f = from + p * (to - from); const k = Math.floor(f), t = f - k; const a = pts[k], b = pts[Math.min(k + 1, pts.length - 1)]; const x = a[0] + (b[0] - a[0]) * t, y = a[1] + (b[1] - a[1]) * t; trail.setAttribute('points', [...pts.slice(0, k + 1), [x, y]].map(q => q.join(',')).join(' ')); hog.setAttribute('x', x - 29); hog.setAttribute('y', y - 29); });
  return [
    ['Yaşil nuqtadan kiramiz. Öngda devor bor, şuning uçun pastga tuşamiz, öngga örib yana pastga.', seg(0, 6)],
    ['Endi öngga yuramiz, tepaga ozgina çiqib, yana öngga va pastga — öng çetgaça.', seg(6, 12)],
    ['Pastda devor bor: çapga ikki qadam, keyin oxirgi qatorga tuşib, öngga — olma şu yerda!', seg(12, pts.length - 1)]
  ];
});

add(28, 'Boğni özing xohlagan ranglarga böya.', 'erkin ijod — töğri yoki xato yöq', st => {
  const F = fillCanvas(IMG('color.png')); const wrap = h('div', { class: 'canvas-wrap wide' }, F.cv); st.append(wrap);
  const pal = ['#7BC74D', '#E5404A', '#F5C731', '#6FB7E8', '#F28C28', '#B8263A', '#8E3B8F', '#F3A6C0', '#3E9B45', '#C99A6B'];
  let regions = null;
  const find = () => F.ready.then(() => {
    if (regions) return regions;
    const W = F.cv.width, H = F.cv.height, d = F.ctx.getImageData(0, 0, W, H).data, lab = new Int32Array(W * H); const list = []; let id = 0;
    for (let y = 0; y < H; y += 3) for (let x = 0; x < W; x += 3) {
      const p = y * W + x; if (lab[p] || d[p * 4] < 128) continue; id++; let size = 0, sx = 0, sy = 0; const st2 = [p]; lab[p] = id;
      while (st2.length) { const q = st2.pop(); size++; const qx = q % W, qy = (q / W) | 0; sx += qx; sy += qy; for (const n of [q - 1, q + 1, q - W, q + W]) { if (n < 0 || n >= W * H || lab[n]) continue; if ((n === q - 1 && qx === 0) || (n === q + 1 && qx === W - 1)) continue; if (d[n * 4] < 128) continue; lab[n] = id; st2.push(n); } }
      list.push({ x, y, size, cy: sy / size });
    }
    list.sort((a, b) => b.size - a.size); regions = list.slice(1).filter(r => r.size > 120);
    return regions;
  });
  const paint = (filter, label) => () => find().then(rs => { const sel = rs.filter(filter); if (INSTANT) { sel.forEach((r, i) => F.fill(r.x / F.cv.width * 100, r.y / F.cv.height * 100, pal[(r.x + r.y) % pal.length])); return; } let i = 0; const tok = runTok; const step = () => { if (tok !== runTok) return; for (let k = 0; k < 6 && i < sel.length; k++, i++) { const r = sel[i]; F.fill(r.x / F.cv.width * 100, r.y / F.cv.height * 100, pal[(r.x + r.y) % pal.length]); } if (i < sel.length) requestAnimationFrame(step); }; step(); });
  return [
    ['Bu betda töğri yoki xato javob yöq — har kim özi xohlagan rangni tanlaydi. Mana, men tepadan boşlayman...', paint(r => r.cy < (F.cv.height * .45))],
    ['...keyin pastini ham böyayman. Sen boşqa ranglar tanlasang ham böladi!', paint(r => r.cy >= (F.cv.height * .45))],
    ['Barakalla! 1-bob tugadi. Eng yoqqan betingni ota-onangga körsat.', () => {}]
  ];
});

/* ---------------- player ---------------- */
const trail = $('#trail'), stage = $('#stage');
let cur = 0, steps = [], k = 0, playing = false, timer = null;
const seen = new Set();
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';

// trail map
(function buildTrail() {
  const n = P.length, W = 1000, H = 150;
  const pts = P.map((_, i) => [40 + i * (W - 80) / (n - 1), 82 + 34 * Math.sin(i * .95)]);
  let d = `M${pts[0][0]} ${pts[0][1]}`; for (let i = 1; i < n; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; const mx = (x0 + x1) / 2; d += ` C${mx} ${y0} ${mx} ${y1} ${x1} ${y1}`; }
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'group', 'aria-label': 'Betlar yöli' });
  svg.append(s('path', { d, fill: 'none', stroke: '#C9A67A', 'stroke-width': 30, 'stroke-linecap': 'round', opacity: .55 }), s('path', { d, fill: 'none', stroke: '#E9D3B4', 'stroke-width': 20, 'stroke-linecap': 'round' }));
  // a few leaves for the garden
  [[120, 20], [360, 132], [610, 18], [840, 135], [960, 30], [250, 30]].forEach(([x, y], i) => svg.append(s('ellipse', { cx: x, cy: y, rx: 14, ry: 6, fill: i % 2 ? '#F2C230' : '#E5505A', opacity: .55, transform: `rotate(${i * 37} ${x} ${y})` })));
  P.forEach((p, i) => { const g = s('g', { class: 'stone', tabindex: 0, role: 'button', 'aria-label': p.n + '-bet yechimi', transform: `translate(${pts[i][0]} ${pts[i][1]})` }, s('circle', { class: 'base', r: 20 }), s('text', {}, String(p.n))); g.addEventListener('click', () => open(i)); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(i); } }); svg.append(g); });
  const guide = s('g', { id: 'guide' }, s('image', { href: IMG('145'), x: -24, y: -64, width: 48, height: 48 }));
  svg.append(guide); trail.append(svg); trail._pts = pts; trail._g = guide;
})();

function render(upto) {
  runTok++;
  const p = P[cur];
  INSTANT = true; stage.classList.add('instant');
  stage.replaceChildren(); steps = p.setup(stage);
  for (let i = 0; i < upto; i++) steps[i][1]();
  requestAnimationFrame(() => requestAnimationFrame(() => { stage.classList.remove('instant'); }));
  INSTANT = false; k = upto; ui();
}
function step() {
  if (k >= steps.length) return;
  steps[k][1](); k++; ui(); const say = $('#say'); say.classList.remove('flash'); void say.offsetWidth; say.classList.add('flash');
}
function ui() {
  const p = P[cur];
  $('#cnt').textContent = k === 0 ? `${p.n}-bet · ${steps.length} qadam` : `${k}-qadam / ${steps.length}`;
  $('#say').textContent = k === 0 ? 'Salom! Men tipratikanman. «Yechimni körsat»ni bos — birga yeçamiz.' : steps[k - 1][0];
  $('#back').disabled = k === 0; $('#fwd').disabled = k >= steps.length; $('#all').disabled = k >= steps.length;
  $('#answer').hidden = k < steps.length;
  $('#pips').replaceChildren(...steps.map((_, i) => h('i', { class: i < k ? 'on' : '' })));
  if (k >= steps.length) stop();
  $('#play').innerHTML = playing ? PAUSE + ' Töxtat' : (k >= steps.length ? PLAY + ' Qaytadan' : (k === 0 ? PLAY + ' Yechimni körsat' : PLAY + ' Davom et'));
}
function stop() { playing = false; clearTimeout(timer); }
function loop() { if (!playing) return; step(); if (k < steps.length) timer = setTimeout(loop, 3000); else { playing = false; ui(); } }
$('#play').onclick = () => { if (playing) { stop(); ui(); return; } if (k >= steps.length) render(0); playing = true; ui(); loop(); };
$('#fwd').onclick = () => { stop(); step(); };
$('#back').onclick = () => { stop(); render(Math.max(0, k - 1)); };
$('#restart').onclick = () => { stop(); render(0); };
$('#all').onclick = () => { stop(); render(steps.length); };

function open(i, keepHash) {
  stop(); cur = i; seen.add(i);
  const p = P[i];
  $('#pnum').textContent = p.n; $('#ptitle').textContent = p.title; $('#answerText').textContent = p.answer;
  [...trail.querySelectorAll('.stone')].forEach((g, j) => { g.classList.toggle('cur', j === i); g.classList.toggle('seen', seen.has(j)); });
  const [x, y] = trail._pts[i]; trail._g.style.transform = `translate(${x}px, ${y}px)`;
  const sv = trail.querySelector('svg'); const sx = x / 1000 * sv.clientWidth - trail.clientWidth / 2; trail.scrollTo({ left: sx, behavior: 'smooth' });
  render(0);
  if (!keepHash) { try { history.replaceState(null, '', '#y' + p.n); } catch { } }
}

// answer key
P.forEach((p, i) => $('#kgrid').append(h('button', { class: 'kc', type: 'button', onclick: () => { open(i); $('.sheet').scrollIntoView({ behavior: 'smooth' }); setTimeout(() => $('#all').click(), 50); } }, h('span', { class: 'n' }, String(p.n)), h('span', { class: 'a' }, h('b', {}, p.title.split('.')[0] + '.'), p.answer))));

const fromHash = () => { const m = /^#y(\d+)$/.exec(location.hash); return m ? P.findIndex(p => p.n === +m[1]) : -1; };
window.addEventListener('hashchange', () => { const i = fromHash(); if (i >= 0 && i !== cur) open(i, true); });
const i0 = fromHash(); open(i0 >= 0 ? i0 : 0, true);
})();
</script>
