<title>Boğ va mevalar: yechimlar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: answer-key app — floating page index on the left, solved worksheet in the centre (always on white paper),
   step timeline on the right; collapses to one column with a bottom control bar on phones. */
:root{
  --bg:#F3F2ED;
  --surface:#FFFFFF;
  --surface-2:#ECEBE4;
  --fg:#1D2220;
  --muted:#626964;
  --hair:#E1DFD6;
  --accent:#E5505A;
  --accent-fg:#FFFFFF;
  --accent-soft:#FCE7E8;
  --good:#2C7D4E;
  --good-soft:#E2F1E7;
  --ring:#F2922E;
  --shadow:0 1px 2px rgba(30,34,32,.06),0 8px 24px -12px rgba(30,34,32,.18);
  --ui:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --head:'Unbounded','Onest',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111413;--surface:#1A1E1C;--surface-2:#232826;--fg:#E8ECE9;--muted:#9AA39E;--hair:#2C322F;
  --accent:#FF6C75;--accent-fg:#1B0B0D;--accent-soft:#3A2326;--good:#71CC93;--good-soft:#1C3125;--ring:#F5A452;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111413;--surface:#1A1E1C;--surface-2:#232826;--fg:#E8ECE9;--muted:#9AA39E;--hair:#2C322F;
  --accent:#FF6C75;--accent-fg:#1B0B0D;--accent-soft:#3A2326;--good:#71CC93;--good-soft:#1C3125;--ring:#F5A452;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block;user-select:none;-webkit-user-drag:none}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}

.app{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;max-width:1500px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}

/* index */
.nav{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--hair);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.brand{display:flex;gap:12px;align-items:center;padding:16px 16px 10px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:1.2rem;flex:0 0 auto}
.eyebrow{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bt{font-family:var(--head);font-weight:700;font-size:1.05rem;line-height:1.2}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 12px;border-bottom:1px solid var(--hair)}
.fc{border:1px solid var(--hair);background:transparent;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.fc i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.fc[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.navlist{list-style:none;margin:0;padding:8px;overflow:auto;flex:1}
.ni{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) 18px;gap:10px;align-items:center;text-align:left;border:0;background:transparent;border-radius:12px;padding:7px 8px}
.ni:hover{background:var(--surface-2)}
.ni[aria-current="true"]{background:var(--accent-soft)}
.ni .n{font-family:var(--head);font-weight:700;font-size:.85rem;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);font-variant-numeric:tabular-nums}
.ni[aria-current="true"] .n{background:var(--accent);color:var(--accent-fg)}
.ni .nt{font-weight:600;font-size:.92rem;line-height:1.2;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .ns{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:5px}
.ni .ns i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.ni .seen{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--good);opacity:0}
.ni.v .seen{opacity:1}
.ni[hidden]{display:none}

/* main */
.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.ph{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--hair);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.pn{flex:0 0 auto;width:60px;height:60px;border-radius:18px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums}
.pt{flex:1;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;color:var(--muted);font-weight:600}
.skill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--fg)}
.skill i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.diff{display:inline-flex;gap:1px;color:var(--ring)}
.diff svg{width:15px;height:15px}
.ph h1{margin:4px 0 0;font-size:clamp(1.05rem,1.7vw,1.35rem);line-height:1.3;font-weight:700;text-wrap:balance}
.acts{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--hair);background:var(--surface);display:grid;place-items:center}
.ib:hover{background:var(--surface-2)}
.ib:disabled{opacity:.35;cursor:default}
.ib svg,.pill svg{width:20px;height:20px}
.pill{height:42px;border-radius:12px;border:1px solid var(--hair);background:var(--surface);display:inline-flex;align-items:center;gap:8px;padding:0 14px;font-weight:600}
.pill:hover{background:var(--surface-2)}

.ans{display:flex;gap:12px;align-items:flex-start;background:var(--good-soft);border-radius:16px;padding:12px 14px}
.al{flex:0 0 auto;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--good);padding-top:5px}
.achips{display:flex;flex-wrap:wrap;gap:6px}
.achips span{background:var(--surface);border-radius:999px;padding:3px 12px;font-weight:600;font-size:.92rem;border:1px solid color-mix(in srgb,var(--good) 30%,transparent)}

.work{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.steps{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--hair);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.sh{display:flex;gap:10px;align-items:center}
.sh img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:12px;padding:2px;transform:scaleX(-1)}
.sh .st{font-weight:700}
.sh .ss{font-size:.82rem;color:var(--muted)}
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:3px}
.mode button{border:0;background:transparent;border-radius:10px;padding:7px;font-weight:600;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.play{border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:700;padding:10px 14px;display:flex;align-items:center;justify-content:center;gap:8px}
.play svg{width:16px;height:16px}
.sl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;position:relative}
.sb{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;text-align:left;border:0;background:transparent;border-radius:12px;padding:8px;color:var(--muted);font-size:.93rem;line-height:1.4}
.sb:hover{background:var(--surface-2)}
.sb .k{width:28px;height:28px;border-radius:50%;border:2px solid var(--hair);display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--surface);position:relative;z-index:1}
.sb.done{color:var(--fg)}
.sb.done .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.sb.cur{background:var(--accent-soft);color:var(--fg);font-weight:600}
.sb.cur .k{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.kbd{margin:0;font-size:.78rem;color:var(--muted)}
.kbd kbd{font-family:var(--ui);font-size:.75rem;border:1px solid var(--hair);border-bottom-width:2px;border-radius:6px;padding:0 5px;background:var(--surface-2)}

/* the worksheet — always paper-white, whatever the theme */
.paper{container-type:inline-size;min-width:0;background:#fff;color:var(--ink);border-radius:20px;padding:18px clamp(12px,2.5vw,26px) 22px;box-shadow:var(--shadow);border:1px solid var(--hair);touch-action:pan-y;
  --ink:#2E2723;--muted:#76685E;--coral:#E5505A;--coral-deep:#B9363F;--orange:#F2922E;--cream:#FFF2E0;--line:#EDDDCB;--ok:#2C9A57;--ok-soft:#E2F4E8;--display:var(--ui)}

.mbar{display:none}
.exit{display:none}

/* present mode */
.present .nav,.present .ans{display:none}
.present .app{grid-template-columns:minmax(0,1fr);max-width:none}
.present .work{grid-template-columns:minmax(0,1fr) 380px}
.present .sb{font-size:1.05rem}
.present .exit{display:inline-flex}
.present #present{display:none}

@media (max-width:1180px){
  .work{grid-template-columns:minmax(0,1fr)}
  .steps{position:static}
  .present .work{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .nav{position:static;max-height:none;border-radius:18px}
  .brand{padding:12px 14px 6px}
  .filters{flex-wrap:nowrap;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
  .fc{flex:0 0 auto}
  .navlist{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 12px;scrollbar-width:thin}
  .navlist li{flex:0 0 auto}
  .ni{display:flex;flex-direction:column;gap:4px;width:auto;padding:4px}
  .ni .nt,.ni .ns{display:none}
  .ni .seen{display:none}
  .ni.v .n{box-shadow:inset 0 0 0 2px var(--good)}
  .ni[aria-current="true"] .n{box-shadow:none}
  .ph{flex-wrap:wrap;gap:12px;padding:12px}
  .pn{width:48px;height:48px;font-size:1.25rem;border-radius:14px}
  .acts{width:100%;justify-content:space-between}
  .kbd{display:none}
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;gap:8px;align-items:center;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--hair);
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .mbar .ib{flex:0 0 auto}
  .mbar .play{flex:1}
  .mbar .cnt{font-family:var(--head);font-weight:700;font-size:.85rem;color:var(--muted);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
  .steps .play{display:none}
}

/* ---------- worksheet components ---------- */
.card{background:#fff;border:2px solid var(--line);border-radius:14px;display:grid;place-items:center;position:relative;padding:6px}
.card img{width:100%;height:100%;object-fit:contain}
.good{border-color:var(--ok)!important;box-shadow:0 0 0 4px rgba(44,154,87,.18);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.dim{opacity:.35;transition:opacity .4s}
.ring::after{content:"";position:absolute;inset:-7px;border:4px solid var(--coral);border-radius:50%;pointer-events:none;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.xmark::after{content:"";position:absolute;inset:10%;pointer-events:none;animation:pop .35s;
  background:linear-gradient(45deg,transparent 45%,var(--coral) 45%,var(--coral) 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,var(--coral) 45%,var(--coral) 55%,transparent 55%)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.dot{width:16px;height:16px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px #fff;flex:0 0 auto}
.rel{position:relative}
.wires{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:2}
.wires line{stroke:var(--coral);stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.wires line.anim{animation:draw .8s ease-out backwards}
@keyframes draw{from{stroke-dashoffset:1}}
.num{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.9rem}
.tag{position:absolute;transform:translate(-50%,-50%);background:var(--coral);color:#fff;font-weight:800;border-radius:999px;padding:0 10px;font-size:.92rem;white-space:nowrap;animation:pop .4s backwards;box-shadow:0 2px 0 rgba(0,0,0,.15);z-index:3;pointer-events:none}
.tag.round{width:30px;height:30px;padding:0;display:grid;place-items:center}
.mark{position:absolute;width:12%;aspect-ratio:1;border:4px solid var(--coral);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:pop .45s cubic-bezier(.2,1.6,.4,1);box-shadow:0 0 0 3px rgba(255,255,255,.85)}
.say-box{background:#fff;border:2px solid #D9D2CC;border-radius:16px;padding:8px 14px;font-weight:700;animation:pop .4s}
.instant *,.instant *::after,.instant *::before{animation:none!important;transition:none!important}

.hgrid{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:14px;align-items:start}
.scene{position:relative;border-radius:16px;overflow:hidden;border:3px solid #F0C86A}
.scene img{width:100%}
.seek{display:flex;flex-direction:column;gap:8px}
.si{display:flex;align-items:center;gap:6px;border:2px solid #F0A3A8;border-radius:12px;padding:4px 6px;background:#fff}
.si img{width:52px;height:52px;object-fit:contain}
.si .tk{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center}
.si.found{border-color:var(--ok);background:var(--ok-soft)}
.si.found .tk{background:var(--ok);border-color:var(--ok);animation:pop .4s}
.si.found .tk::after{content:"";width:9px;height:5px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
@container (max-width:560px){.hgrid{grid-template-columns:1fr}.seek{flex-direction:row;flex-wrap:wrap;order:-1}.si{flex:1 1 calc(25% - 8px);justify-content:center}.si img{width:38px;height:38px}}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px clamp(50px,16cqi,200px);max-width:540px;margin:0 auto}
.cols .card{width:100%;max-width:104px;aspect-ratio:1}
.cols .l{justify-self:start;display:flex;align-items:center;gap:12px}
.cols .r{justify-self:end;display:flex;align-items:center;gap:12px}

.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tr{background:var(--cream);border:2px solid #F3D9BA;border-radius:16px;padding:6px;position:relative}
.tr .ref{position:absolute;left:8px;top:8px;width:44px;height:44px;background:#fff;border-radius:10px;padding:3px;border:2px solid var(--line)}
.tr svg{width:100%;height:auto;display:block}
.tr .ink{stroke-dasharray:1;stroke-dashoffset:0}
.tr .ink.anim{animation:draw 1.6s ease-in-out backwards}
.tr .fill{transition:fill .6s .9s}
@container (max-width:560px){.tgrid{grid-template-columns:1fr 1fr}}

.prow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cells{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;flex:1;min-width:0}
.cell{aspect-ratio:1;border:2px solid var(--line);border-radius:10px;display:grid;place-items:center;padding:4px;background:#fff;position:relative}
.cell img{width:100%;height:100%;object-fit:contain}
.cell .sm{width:58%;height:58%}
.cell.empty{border-color:#9C918A}
.cell.empty img.o{opacity:.45}
.cell .pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) backwards}
@container (max-width:520px){.cells{grid-template-columns:repeat(4,minmax(0,1fr))}}

.frow{display:flex;justify-content:center;gap:10px}
.fr{display:flex;flex-direction:column;align-items:center;gap:8px}
.fr .card{width:min(80px,15cqi);aspect-ratio:1}
.baskets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:36px auto;max-width:600px}
.basket{display:flex;flex-direction:column;align-items:center;gap:6px}
.basket .b{width:min(140px,24cqi)}
.sign{width:56px;height:56px;border:3px solid var(--coral);border-radius:50%;padding:7px;background:#fff}
.bc{font-weight:800;font-size:1.15rem;color:var(--coral-deep);min-height:1.5em}
.bc span{display:inline-block;animation:pop .4s backwards}

.cut{display:grid;grid-template-columns:minmax(0,1.1fr) 40px repeat(3,minmax(0,1fr));gap:10px;align-items:center;background:var(--cream);border:2px solid #F3D9BA;border-radius:16px;padding:10px;margin-bottom:10px}
.cut .card{aspect-ratio:1}
.arrow{height:4px;background:var(--coral);border-radius:2px;position:relative}
.arrow::after{content:"";position:absolute;right:-2px;top:-5px;border:7px solid transparent;border-left:10px solid var(--coral);border-right:0}
.cut.hl{box-shadow:0 0 0 4px #FFD866}
@container (max-width:460px){.cut{grid-template-columns:minmax(0,1fr) 16px repeat(3,minmax(0,1fr));gap:6px}}

.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.four .card{aspect-ratio:3/4;padding:0;overflow:hidden}
.four .card img{object-fit:cover}
.four .tool{aspect-ratio:1;padding:10px}
.cw{display:flex;flex-direction:column;align-items:center;gap:8px}
.gapv{height:clamp(50px,10cqi,90px)}
.lines{display:flex;flex-direction:column;gap:8px;margin-top:14px;align-items:flex-start}

.cg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.cb{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 4px;border-radius:14px;position:relative}
.cb img{width:100%;max-width:150px}
.circ,.nums{display:flex;gap:3px;border:2px solid var(--line);border-radius:999px;padding:4px 6px;background:#fff}
.circ i{width:clamp(12px,2.6cqi,20px);aspect-ratio:1;border-radius:50%;border:2px solid var(--ink)}
.circ i.on{background:var(--coral);border-color:var(--coral-deep);animation:pop .3s backwards}
.nums{background:#FFF4E6}
.nums span{font-weight:700;width:clamp(15px,3cqi,24px);aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:clamp(.8rem,1.9cqi,1rem)}
.nums span.on{box-shadow:inset 0 0 0 2.5px var(--coral);color:var(--coral-deep);animation:pop .4s backwards}
.cb.best{background:var(--ok-soft)}
.cb.least{background:#FDE7E3}
.cb .lbl{font-weight:800;font-size:.88rem;color:var(--coral-deep);animation:pop .4s}
@container (max-width:560px){.cg{grid-template-columns:1fr}.cb{flex-direction:row;flex-wrap:wrap;justify-content:center}.cb img{max-width:100px}}

.tg{display:flex;flex-direction:column;align-items:center;gap:28px}
.tgt{display:flex;flex-direction:column;align-items:center;gap:10px}
.tgt .im{display:flex;align-items:center;gap:12px}
.tgt img{width:min(180px,36cqi)}
.tgt.wide img{width:min(280px,56cqi)}
.tgt .lab{font-weight:800;letter-spacing:.12em;color:var(--muted)}
.six{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;width:100%;max-width:620px}
.six .card{aspect-ratio:1;width:100%}

.shelf{background:var(--cream);border:2px solid #F3D9BA;border-radius:18px;padding:12px;margin-bottom:12px}
.shelf h3{margin:0 0 6px;font-size:1rem}
.shelf .rel img{border-radius:10px}
.opts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.opts .card{width:88px;aspect-ratio:1}

.irow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.items{display:grid;gap:8px;flex:1;min-width:0}
.items .card{aspect-ratio:1}

.prw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,5fr) minmax(0,1fr);align-items:center;gap:6px;margin-bottom:14px}
.prw svg{width:100%;height:auto;display:block}

.prep{display:grid;grid-template-columns:minmax(0,1.1fr) repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
.phr{background:var(--cream);border:2px solid #F3D9BA;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:700;font-size:1.05rem;position:relative}
.phr em{font-style:normal;color:var(--coral)}
.phr .num{position:absolute;left:8px;top:8px}
.prep .card{aspect-ratio:4/5;padding:0}
.prep .card img{object-fit:cover;border-radius:12px}

.maze svg{width:100%;max-width:500px;height:auto;display:block;margin:0 auto}

.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.three .card{aspect-ratio:1;padding:0}
.three .card img{object-fit:cover;border-radius:12px}
.three .num{position:absolute;left:8px;top:8px;z-index:1}
.ends{background:var(--cream);border:2px solid #F3D9BA;border-radius:18px;padding:12px;margin-top:14px}
.ends h3{text-align:center;margin:0 0 10px}
.cap{position:absolute;left:6px;right:6px;bottom:6px;background:rgba(255,255,255,.93);border-radius:10px;padding:4px 8px;font-size:.82rem;font-weight:700;animation:pop .4s backwards}

.canvas-wrap{position:relative;max-width:540px;margin:0 auto}
.canvas-wrap canvas{width:100%;height:auto;display:block;border:3px solid #F0C86A;border-radius:16px;background:#fff}
.canvas-wrap.wide{max-width:none}
.pick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:12px}
.pick .card{aspect-ratio:1}
@container (max-width:480px){.pick{grid-template-columns:repeat(3,minmax(0,1fr))}}

.spot{display:grid;gap:12px}
.spot .scene .mark{width:11%}

.drow{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1.4fr);gap:12px;align-items:center;background:var(--cream);border:2px solid #F3D9BA;border-radius:18px;padding:12px;margin-bottom:12px;position:relative}
.drow .numtag{position:absolute;left:10px;top:10px}
.drow figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.drow figcaption{font-weight:700;color:var(--muted)}
.drow svg{width:100%;height:auto;display:block;background:#fff;border-radius:14px;border:2px solid var(--line)}
.drow figure svg{max-width:180px}
.drow .user svg{max-width:260px;margin:0 auto;border-color:#8D847E}
.drow .arrow{background:#999}.drow .arrow::after{border-left-color:#999}
.seg{stroke-dasharray:1;stroke-dashoffset:0}
.seg.anim{animation:draw .5s ease-out backwards}

.test{background:var(--cream);border:2px solid #F3D9BA;border-radius:18px;padding:12px 14px;margin-bottom:12px}
.test h3{margin:0 0 10px;display:flex;align-items:center;gap:8px;font-size:1rem}
.rowi{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.test .card{width:min(70px,13cqi);aspect-ratio:3/4}
.q{border:3px dashed #A99F98;border-radius:14px;width:min(70px,13cqi);aspect-ratio:3/4;display:grid;place-items:center;font-size:2rem;font-weight:800;color:#A99F98;background:#fff;padding:6px}
.q img{width:100%;height:100%;object-fit:contain;animation:pop .45s}
.vbar{width:2px;align-self:stretch;background:#8A807A;margin:0 6px}

@media (prefers-reduced-motion:reduce){*,*::after,*::before{animation:none!important;transition:none!important}}

<script>
(() => {
'use strict';
const IMG = id => 'img/' + id + (/\.(png|webp)$/.test(id) ? '' : '.webp');
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k === 'class') n.className = v; else if (k === 'html') n.innerHTML = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v); }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
function s(tag, attrs, ...kids) { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs || {})) if (v != null) n.setAttribute(k, v); for (const c of kids.flat()) if (c) n.append(c); return n; }
const pic = (id, alt = '') => h('img', { src: IMG(id), alt, draggable: 'false' });
const card = (id, alt = '', cls = '') => h('div', { class: 'card ' + cls }, pic(id, alt));
const stagger = (els, gap = .15) => els.forEach((e, i) => e.style.animationDelay = (i * gap) + 's');
const store = { get(k, d) { try { const v = localStorage.getItem('boqy.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('boqy.' + k, JSON.stringify(v)); } catch {} } };
let INSTANT = false, runTok = 0;

function wires(root) {
  const svg = s('svg', { class: 'wires' }); root.append(svg);
  const links = []; let lw = 0, lh = 0;
  const pt = n => { const r = n.getBoundingClientRect(), R = root.getBoundingClientRect(); return [r.left + r.width / 2 - R.left, r.top + r.height / 2 - R.top]; };
  function draw(fresh) {
    svg.replaceChildren(); lw = root.clientWidth; lh = root.clientHeight;
    links.forEach((l, i) => { const [x1, y1] = pt(l[0]), [x2, y2] = pt(l[1]); const ln = s('line', { x1, y1, x2, y2, pathLength: 1 }); if (fresh && fresh.includes(i) && !INSTANT) { ln.classList.add('anim'); ln.style.animationDelay = (fresh.indexOf(i) * .25) + 's'; } svg.append(ln); });
  }
  new ResizeObserver(() => { if (root.clientWidth !== lw || root.clientHeight !== lh) draw(); }).observe(root);
  return { add(pairs) { const start = links.length; pairs.forEach(p => links.push(p)); draw(pairs.map((_, k) => start + k)); } };
}
const tag = (box, x, y, text, round) => { const t = h('span', { class: 'tag' + (round ? ' round' : '') }, text); t.style.left = x + '%'; t.style.top = y + '%'; box.append(t); return t; };
const mark = (box, x, y) => { const m = h('span', { class: 'mark' }); m.style.left = x + '%'; m.style.top = y + '%'; box.append(m); return m; };
function animate(dur, fn) { if (INSTANT) { fn(1); return; } const tok = runTok, t0 = performance.now(); const tick = now => { if (tok !== runTok) return; const p = Math.min(1, (now - t0) / dur); fn(p); if (p < 1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); }

function fillCanvas(src) {
  const cv = h('canvas', { 'aria-label': 'Rasm' }); const ctx = cv.getContext('2d', { willReadFrequently: true });
  const ready = new Promise(res => { const im = new Image(); im.onload = () => { cv.width = im.naturalWidth; cv.height = im.naturalHeight; ctx.drawImage(im, 0, 0); res(); }; im.src = src; });
  function fill(px, py, color) {
    const W = cv.width, H = cv.height, x = Math.floor(px / 100 * W), y = Math.floor(py / 100 * H);
    const img = ctx.getImageData(0, 0, W, H), d = img.data, i0 = (y * W + x) * 4;
    const sr = d[i0], sg = d[i0 + 1], sb = d[i0 + 2]; if (sr + sg + sb < 200) return;
    const c = [parseInt(color.slice(1, 3), 16), parseInt(color.slice(3, 5), 16), parseInt(color.slice(5, 7), 16)];
    const same = i => Math.abs(d[i] - sr) + Math.abs(d[i + 1] - sg) + Math.abs(d[i + 2] - sb) < 60;
    const seen = new Uint8Array(W * H), st = [x, y];
    while (st.length) { const yy = st.pop(), xx = st.pop(); let lx = xx; while (lx >= 0 && !seen[yy * W + lx] && same((yy * W + lx) * 4)) lx--; lx++; let up = false, dn = false;
      for (let cx = lx; cx < W; cx++) { const p = yy * W + cx; if (seen[p] || !same(p * 4)) break; seen[p] = 1; d[p * 4] = c[0]; d[p * 4 + 1] = c[1]; d[p * 4 + 2] = c[2];
        if (yy > 0) { const q = p - W, ok = !seen[q] && same(q * 4); if (ok && !up) { st.push(cx, yy - 1); up = true; } else if (!ok) up = false; }
        if (yy < H - 1) { const q = p + W, ok = !seen[q] && same(q * 4); if (ok && !dn) { st.push(cx, yy + 1); dn = true; } else if (!ok) dn = false; } } }
    ctx.putImageData(img, 0, 0);
  }
  return { cv, ctx, ready, fill };
}

/* ---------------- solutions ---------------- */
const SKILLS = { diqqat: ['Diqqat', '#3B82C4'], mantiq: ['Mantiq', '#8E5BD0'], saralash: ['Saralaş', '#C98316'], sanash: ['Sanaş', '#E5505A'], motorika: ['Qöl motorikasi', '#2F9E6E'], xotira: ['Xotira', '#C2508F'], nutq: ['Nutq', '#1F9BAA'], sinov: ['Sinov', '#7A817C'], ijod: ['Ijod', '#E07B39'] };
const P = [];
const add = (n, short, skill, stars, title, answer, setup) => P.push({ n, short, skill, stars, title, answer, setup });

add(8, 'Yaşirin narsalar', 'diqqat', 1, 'Boğni kör! Öngdagi 8 ta narsani rasmdan top. Topganingni belgila.', '8 ta narsa topildi · yerda 4 ta anor', st => {
  const items = [
    ['001', [21, 88], 'Tipratikan pastda, barglar uyumiga kirib olgan.'],
    ['002', [11, 66], 'Muşuk çap tomonda, buta orqasidan möralayapti.'],
    ['003', [76, 8], 'Çumçuq öng tepada, nok daraxti şoxida ötiribdi.'],
    ['004', [11.5, 46.5], 'Qölqop şoxga ilinib qolgan, narvon yonida.'],
    ['005', [90, 72], 'Suğorgiç öngda, örindiq yonida turibdi.'],

  st.append(h('div', { class: 'hgrid' }, sc, list));
  const poms = [[40, 93.5], [58, 91], [64.5, 93.5], [70, 91.5]];
  return [
    ...items.map(([, p, t], i) => [t, () => { rows[i].classList.add('found'); mark(sc, p[0], p[1]); }]),
    ['Zukko qadam: yerdagi anorlarni sanaymiz — 1, 2, 3, 4. Jami 4 ta anor!', () => { stagger(poms.map(([x, y], i) => tag(sc, x, y - 5.5, String(i + 1), true)), .35); }]
  ];
});

add(9, 'Soyalar', 'mantiq', 1, 'Har birini öz soyasi bilan çiziq orqali ula.', '5 juft · barg soyasining jufti yöq', st => {
  const L = [['009', 'a'], ['010', 'p'], ['011', 'g'], ['012', 'u'], ['013', 'c']];
  const R = [['014', 'u'], ['015', 'g'], ['016', 'leaf'], ['017', 'a'], ['018', 'c'], ['019', 'p']];
  const grid = h('div', { class: 'cols rel' }); const ld = {}, rd = {}, rc = {};
  R.forEach(([id, k], i) => {
    if (L[i]) { const d = h('span', { class: 'dot' }); const w = h('div', { class: 'l' }, card(L[i][0]), d); w.style.gridRow = i + 1; w.style.gridColumn = 1; ld[L[i][1]] = d; grid.append(w); }
    const d2 = h('span', { class: 'dot' }), c2 = card(id); const w2 = h('div', { class: 'r' }, d2, c2); w2.style.gridRow = i + 1; w2.style.gridColumn = 2; rd[k] = d2; rc[k] = c2; grid.append(w2);
  });
  st.append(grid); const w = wires(grid);
  const t = { a: 'Olma soyasi: dumaloq, tepasida bandi va bargi bor.', p: 'Nok soyasi: pasti keng, tepasi ingiçka.', g: 'Anor soyasi: tepasida kiçkina toji bor.', u: 'Uzum soyasi: köp mayda donalardan iborat.', c: 'Sabzi soyasi: uzun, uçi ingiçka, bargi patdek.' };
  return [...L.map(([, k]) => [t[k], () => { w.add([[ld[k], rd[k]]]); rc[k].classList.add('good'); }]),
    ['Zukko qadam: bitta soya ortiqça qoldi — bu barg soyasi! Çapda barg yöq.', () => rc.leaf.classList.add('ring')]];
});

add(10, 'Punktir böylab', 'motorika', 1, 'Punktir böylab çizib, mevalarni tugat. Keyin ularni böya.', 'olma — qizil · nok — sariq · anor — tög qizil · tarvuz — yaşil', st => {
  const shapes = [
    ['020', 'Olma: yaşil nuqtadan boşlab aylana çizamiz, keyin bandi va bargini qöşamiz. Qizilga böyaymiz.', 'M100 66 C 116 52, 156 52, 160 100 C 164 150, 128 182, 100 168 C 72 182, 36 150, 40 100 C 44 52, 84 52, 100 66 Z M100 66 C 100 52, 104 42, 110 34 M104 48 C 112 26, 140 22, 154 30 C 144 46, 122 54, 104 48', '#E5404A'],
    ['021', 'Nok: tepasi ingiçka, pasti keng. Sariqqa böyaymiz.', 'M100 46 C 116 46, 120 76, 130 94 C 152 118, 162 138, 156 158 C 148 186, 52 186, 44 158 C 38 138, 48 118, 70 94 C 80 76, 84 46, 100 46 Z M100 46 C 100 34, 104 24, 110 18', '#F5C731'],
    ['022', 'Anor: avval tojini, keyin dumaloq tanasini çizamiz. Tög qizilga böyaymiz.', 'M84 54 L78 38 L92 46 L100 32 L108 46 L122 38 L116 54 C 150 62, 168 90, 164 120 C 160 158, 130 180, 100 180 C 70 180, 40 158, 36 120 C 32 90, 50 62, 84 54 Z', '#B8263A'],
    ['023', 'Tarvuz: katta dumaloq. Yaşilga böyaymiz.', 'M100 40 A 68 68 0 1 1 99.9 40 Z', '#3E9B45']
  ];
  const grid = h('div', { class: 'tgrid' }); st.append(grid);
  const parts = shapes.map(([img, , d, col]) => {
    const body = d.split(' M')[0];
    const fill = s('path', { d: body, fill: 'transparent', class: 'fill' });
    const guide = s('path', { d, fill: 'none', stroke: '#9C948D', 'stroke-width': 3, 'stroke-dasharray': '7 6' });
    const ink = s('path', { d, fill: 'none', stroke: '#2E2723', 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', pathLength: 1, class: 'ink', visibility: 'hidden' });
    const svg = s('svg', { viewBox: '0 0 200 200' }, fill, guide, ink);
    grid.append(h('div', { class: 'tr' }, h('div', { class: 'ref' }, pic(img)), svg));
    requestAnimationFrame(() => { const p = guide.getPointAtLength(0); svg.append(s('circle', { cx: p.x, cy: p.y, r: 7, fill: '#2C9A57' })); });
    return { fill, ink, col };
  });
  return shapes.map(([, t], i) => [t, () => { const p = parts[i]; p.ink.setAttribute('visibility', 'visible'); if (!INSTANT) p.ink.classList.add('anim'); p.fill.setAttribute('fill', p.col); }]);
});

add(11, 'Naqş', 'mantiq', 1, 'Naqşni davom ettir. Böş joylarni töğri rangga böya.', 'qizil–sariq · qizil–yaşil · katta–kiçik', st => {
  const rows = [['024', '025', '028', false], ['032', '033', '036', false], ['040', '040', '044', true]];
  const slots = rows.map(([a, b, o, sz], ri) => {
    const cells = h('div', { class: 'cells' });

    for (let i = 0; i < 4; i++) cells.append(h('div', { class: 'cell' }, mk(i % 2)));
    const e = []; for (let i = 0; i < 4; i++) { const c = h('div', { class: 'cell empty' }, h('img', { src: IMG(o), alt: '', class: 'o' })); e.push(c); cells.append(c); }

});

add(12, 'Savatlar', 'saralash', 1, 'Har savatning tagida belgi bor. Har mevani öz savatiga çiziq bilan ula.', 'har savatda 3 tadan — teng', st => {
  const top = [['052', 'a'], ['053', 'g'], ['054', 'p'], ['055', 'a'], ['056', 'g']], bot = [['063', 'p'], ['064', 'a'], ['065', 'p'], ['066', 'g']];
  const root = h('div', { class: 'rel' }); const F = [];
  const row = (list, pos) => { const r = h('div', { class: 'frow' }); list.forEach(([id, k]) => { const d = h('span', { class: 'dot' }); const c = card(id); F.push({ k, pos, d, c }); r.append(pos === 't' ? h('div', { class: 'fr' }, c, d) : h('div', { class: 'fr' }, d, c)); }); return r; };
  const B = {}; const bas = h('div', { class: 'baskets' });
  [['057', '058', 'a'], ['059', '060', 'p'], ['061', '062', 'g']].forEach(([b, sg, k]) => { const t = h('span', { class: 'dot' }), d = h('span', { class: 'dot' }), cnt = h('div', { class: 'bc' }); B[k] = { t, d, cnt }; bas.append(h('div', { class: 'basket' }, t, h('img', { class: 'b', src: IMG(b), alt: '' }), h('img', { class: 'sign', src: IMG(sg), alt: '' }), d, cnt)); });
  root.append(row(top, 't'), bas, row(bot, 'b')); st.append(root); const w = wires(root);
  const go = k => () => { const fs = F.filter(f => f.k === k); w.add(fs.map(f => [f.d, f.pos === 't' ? B[k].t : B[k].d])); fs.forEach(f => f.c.classList.add('good')); };
  return [

    ['Anor belgili savatga anorlar: tepada ikkita, pastda bitta.', go('g')],
    ['Zukko qadam: har savatda 3 tadan meva. Hammasi teng!', () => Object.values(B).forEach(b => b.cnt.replaceChildren(h('span', {}, '3 ta')))]

add(19, 'Yöl böylab', 'motorika', 2, 'Har kimni öz yöli böylab olib bor. Yöldan çiqma!', 'kapalak → gul · tipratikan → olma · qiz → savat', st => {
  const wave = [], steps = [], loops = [];
  for (let i = 0; i <= 300; i++) { const t = i / 300; wave.push([20 + t * 560, 80 + 52 * Math.sin(t * Math.PI * 9 - Math.PI / 2)]); }
  { let x = 20, y = 130; const pts = [[x, y]]; for (const [dx, dy] of [[60, 0], [0, -26], [60, 0], [0, -26], [60, 0], [0, -26], [60, 0], [0, 26], [60, 0], [0, 26], [60, 0], [0, 26], [60, 0]]) { for (let k = 1; k <= 12; k++) pts.push([x + dx * k / 12, y + dy * k / 12]); x += dx; y += dy; } const sx = 560 / (x - 20); pts.forEach(([px, py]) => steps.push([20 + (px - 20) * sx, py])); }
  { const raw = []; for (let i = 0; i <= 420; i++) { const t = Math.PI + i / 420 * Math.PI * 6; raw.push([20 * t - 48 * Math.sin(t), 80 - 48 * Math.cos(t)]); } const x0 = raw[0][0], x1 = raw[raw.length - 1][0]; raw.forEach(([x, y]) => loops.push([20 + (x - x0) / (x1 - x0) * 560, y])); }
  const D = [[wave, '127', '128', 'Kapalak tölqin böylab: tepaga, pastga, tepaga, pastga... gulgaça.'], [steps, '129', '130', 'Tipratikan zinapoya böylab: uç poğona tepaga, uç poğona pastga — olmaga yetdi!'], [loops, '131', '132', 'Qiz halqaçalar böylab: har bir halqani aylanib öt, keyin savatga yet.']];
  const R = D.map(([pts, a, b]) => {
    const d = 'M' + pts.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L');
    const trail = s('polyline', { fill: 'none', stroke: '#E5505A', 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    const tok = s('circle', { r: 15, fill: '#2C9A57', stroke: '#fff', 'stroke-width': 4, cx: pts[0][0], cy: pts[0][1] });
    const svg = s('svg', { viewBox: '0 0 600 160' }, s('path', { d, fill: 'none', stroke: '#F3E2CC', 'stroke-width': 30, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }), s('path', { d, fill: 'none', stroke: '#8F8780', 'stroke-width': 2.5, 'stroke-dasharray': '8 7' }), trail, s('circle', { cx: pts[pts.length - 1][0], cy: pts[pts.length - 1][1], r: 9, fill: '#E5505A' }), tok);
    st.append(h('div', { class: 'prw' }, pic(a), svg, pic(b)));
    return () => animate(2600, p => { const k = Math.round(p * (pts.length - 1)); trail.setAttribute('points', pts.slice(0, k + 1).map(q => q.join(',')).join(' ')); tok.setAttribute('cx', pts[k][0]); tok.setAttribute('cy', pts[k][1]); });
  });
  return D.map(([, , , t], i) => [t, R[i]]);
});

add(21, 'Labirint', 'motorika', 2, 'Tipratikanni olmaga olib bor. Yaşil nuqtadan boşlab yöl çiz, devordan ötma!', 'pastga → öngga → tepaga → öngga → pastga → çapga → pastga → öngga', st => {
  const N = 6, C = 70, O = 60;
  const V = ['0,0', '1,1', '2,1', '1,2', '2,2', '2,4', '3,3', '2,0', '3,0', '4,2'], Hh = ['0,1', '0,4', '0,5', '1,0', '1,3', '1,4', '2,2', '3,1', '3,2', '3,3', '3,4', '4,1', '4,2', '4,4', '4,5'];
  const svg = s('svg', { viewBox: `0 0 ${N * C + O * 2} ${N * C + O * 2}` }); svg.append(s('rect', { x: O, y: O, width: N * C, height: N * C, fill: '#F6E6D4' }));
  const wall = (a, b, c, d) => svg.append(s('line', { x1: O + a * C, y1: O + b * C, x2: O + c * C, y2: O + d * C, stroke: '#C8424C', 'stroke-width': 6, 'stroke-linecap': 'round' }));
  wall(0, 0, N, 0); wall(0, N, N, N); wall(0, 1, 0, N); wall(N, 0, N, N - 1);
  V.forEach(k => { const [r, c] = k.split(',').map(Number); wall(c + 1, r, c + 1, r + 1); }); Hh.forEach(k => { const [r, c] = k.split(',').map(Number); wall(c, r + 1, c + 1, r + 1); });
  const ctr = ([r, c]) => [O + c * C + C / 2, O + r * C + C / 2];
  const path = [[0, 0], [1, 0], [1, 1], [2, 1], [3, 1], [3, 2], [3, 3], [2, 3], [2, 4], [3, 4], [3, 5], [4, 5], [4, 4], [4, 3], [5, 3], [5, 4], [5, 5]];
  const pts = [[O - 18, O + C / 2], ...path.map(ctr), [O + N * C + 20, O + (N - 1) * C + C / 2]];
  const trail = s('polyline', { fill: 'none', stroke: '#2C9A57', 'stroke-width': 9, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .75 });
  const hog = s('image', { href: IMG('145'), width: 58, height: 58, x: pts[0][0] - 29, y: pts[0][1] - 29 });
  svg.append(trail, s('circle', { cx: O - 18, cy: O + C / 2, r: 10, fill: '#2C9A57' }), s('image', { href: IMG('146'), x: O + N * C + 4, y: O + (N - 1) * C + 8, width: 54, height: 54 }), hog);
  st.append(h('div', { class: 'maze' }, svg));
  const seg = (from, to) => () => animate((to - from) * 260, p => { const f = from + p * (to - from); const k = Math.floor(f), t = f - k; const a = pts[k], b = pts[Math.min(k + 1, pts.length - 1)]; const x = a[0] + (b[0] - a[0]) * t, y = a[1] + (b[1] - a[1]) * t; trail.setAttribute('points', [...pts.slice(0, k + 1), [x, y]].map(q => q.join(',')).join(' ')); hog.setAttribute('x', x - 29); hog.setAttribute('y', y - 29); });
  return [
    ['Yaşil nuqtadan kiramiz. Öngda devor bor, şuning uçun pastga tuşamiz, öngga örib yana pastga.', seg(0, 6)],
    ['Endi öngga yuramiz, tepaga ozgina çiqib, yana öngga va pastga — öng çetgaça.', seg(6, 12)],
    ['Pastda devor bor: çapga ikki qadam, keyin oxirgi qatorga tuşib, öngga — olma şu yerda!', seg(12, pts.length - 1)]
  ];
});

add(25, 'Farqni top', 'diqqat', 2, 'Ikki rasmni soliştir. Pastki rasmda 4 ta farqni top va doiraga ol.', 'yaşil olma · köylak · savat · muşuk · + kök lenta', st => {

});

  return [...shapes.map((sh, i) => [sh[5], R[i].go]),

add(28, 'Böyaş', 'ijod', 0, 'Boğni özing xohlagan ranglarga böya.', 'erkin ijod — töğri yoki xato javob yöq', st => {
  const F = fillCanvas(IMG('color.png')); const wrap = h('div', { class: 'canvas-wrap wide' }, F.cv); st.append(wrap);
  const pal = ['#7BC74D', '#E5404A', '#F5C731', '#6FB7E8', '#F28C28', '#B8263A', '#8E3B8F', '#F3A6C0', '#3E9B45', '#C99A6B'];
  let regions = null;
  const find = () => F.ready.then(() => {
    if (regions) return regions;
    const W = F.cv.width, H = F.cv.height, d = F.ctx.getImageData(0, 0, W, H).data, lab = new Int32Array(W * H); const list = []; let id = 0;
    for (let y = 0; y < H; y += 3) for (let x = 0; x < W; x += 3) {
      const p = y * W + x; if (lab[p] || d[p * 4] < 128) continue; id++; let size = 0, sy = 0; const st2 = [p]; lab[p] = id;
      while (st2.length) { const q = st2.pop(); size++; const qx = q % W; sy += (q / W) | 0; for (const n of [q - 1, q + 1, q - W, q + W]) { if (n < 0 || n >= W * H || lab[n]) continue; if ((n === q - 1 && qx === 0) || (n === q + 1 && qx === W - 1)) continue; if (d[n * 4] < 128) continue; lab[n] = id; st2.push(n); } }
      list.push({ x, y, size, cy: sy / size });
    }
    list.sort((a, b) => b.size - a.size); regions = list.slice(1).filter(r => r.size > 120);
    return regions;
  });
  const paint = filter => () => { const tok = runTok; find().then(rs => { if (tok !== runTok) return; const sel = rs.filter(filter); let i = 0; const go = () => { if (tok !== runTok) return; for (let k = 0; k < 8 && i < sel.length; k++, i++) { const r = sel[i]; F.fill(r.x / F.cv.width * 100, r.y / F.cv.height * 100, pal[(r.x + r.y) % pal.length]); } if (i < sel.length) requestAnimationFrame(go); }; go(); }); };
  return [
    ['Bu betda töğri yoki xato javob yöq — har kim özi xohlagan rangni tanlaydi. Mana, men tepadan boşlayman...', paint(r => r.cy < (F.cv.height * .45))],
    ['...keyin pastini ham böyayman. Sen boşqa ranglar tanlasang ham böladi!', paint(r => r.cy >= (F.cv.height * .45))],
    ['Barakalla! 1-bob tugadi. Eng yoqqan betingni ota-onangga körsat.', () => {}]
  ];
});

/* ---------------- app shell ---------------- */
const stage = $('#stage');
const STAR = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
const STAR_O = '<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 3.5l2.6 5.5 6 .7-4.4 4.2 1.2 6L12 17l-5.4 2.9 1.2-6L3.4 9.7l6-.7z"/></svg>';
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
const CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
let cur = 0, steps = [], k = 0, playing = false, timer = null, filter = 'all';
const seen = new Set(store.get('seen', []));

// filters
const fbox = $('#filters');
const usedSkills = [...new Set(P.map(p => p.skill))];
[['all', 'Hammasi', null], ...usedSkills.map(sk => [sk, SKILLS[sk][0], SKILLS[sk][1]])].forEach(([key, lab, col]) => {
  const b = h('button', { class: 'fc', type: 'button', 'aria-pressed': key === 'all' ? 'true' : 'false' }, col ? h('i') : null, lab);
  if (col) b.style.setProperty('--c', col);
  b.onclick = () => { filter = key; fbox.querySelectorAll('.fc').forEach(x => x.setAttribute('aria-pressed', x === b)); paintNav(); };
  fbox.append(b);
});
// index
const nl = $('#navlist');
const navItems = P.map((p, i) => {
  const b = h('button', { class: 'ni', type: 'button', onclick: () => open(i) },
    h('span', { class: 'n' }, String(p.n)),
    h('span', { style: 'min-width:0' }, h('span', { class: 'nt' }, p.short), h('span', { class: 'ns' }, h('i'), SKILLS[p.skill][0])),
    h('span', { class: 'seen', html: CHECK, 'aria-label': 'körildi' }));
  b.style.setProperty('--c', SKILLS[p.skill][1]);
  b.setAttribute('aria-label', `${p.n}-bet: ${p.short}`);
  const li = h('li', {}, b); nl.append(li); return { li, b };
});
const visible = () => P.map((p, i) => i).filter(i => filter === 'all' || P[i].skill === filter);
function paintNav() {
  navItems.forEach(({ li, b }, i) => { li.hidden = !(filter === 'all' || P[i].skill === filter); b.setAttribute('aria-current', i === cur ? 'true' : 'false'); b.classList.toggle('v', seen.has(P[i].n)); });
  const vis = visible();
  $('#prevP').disabled = !vis.some(i => i < cur);
  $('#nextP').disabled = !vis.some(i => i > cur);
}
function stepPage(dir) {
  const vis = visible(); if (!vis.length) return;
  const next = dir > 0 ? vis.find(i => i > cur) : [...vis].reverse().find(i => i < cur);
  if (next != null) open(next);
}

function render(upto) {
  runTok++;
  INSTANT = true; stage.classList.add('instant');
  stage.replaceChildren(); steps = P[cur].setup(stage);
  upto = Math.min(upto, steps.length);
  for (let i = 0; i < upto; i++) steps[i][1]();
  INSTANT = false; k = upto;
  requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('instant')));
  buildSteps(); ui();
}
function advance() { if (k >= steps.length) return; steps[k][1](); k++; ui(); }
function goStep(i) { stop(); if (i === k) return; if (i === k + 1) { advance(); return; } render(Math.max(0, i - 1)); if (i > 0) advance(); }

const sl = $('#sl');
function buildSteps() {
  sl.replaceChildren(...steps.map(([t], i) => h('li', {}, h('button', { class: 'sb', type: 'button', onclick: () => goStep(i + 1) }, h('span', { class: 'k' }, String(i + 1)), h('span', {}, t)))));
  $('#ss').textContent = steps.length + ' qadam';
}
function ui() {
  const N = steps.length;
  [...sl.querySelectorAll('.sb')].forEach((b, i) => { b.classList.toggle('done', i < k); b.classList.toggle('cur', i === k - 1); });
  $('#mTask').setAttribute('aria-pressed', k === 0); $('#mSol').setAttribute('aria-pressed', k === N);
  const lab = playing ? PAUSE + 'Töxtat' : (k === 0 ? PLAY + 'Qadamma-qadam' : k >= N ? PLAY + 'Qaytadan körsat' : PLAY + 'Davom et');
  $('#play').innerHTML = lab; $('#mPlay').innerHTML = lab;
  $('#mCnt').textContent = k + ' / ' + N;
  $('#mPrev').disabled = k === 0; $('#mNext').disabled = k >= N;
}
function stop() { playing = false; clearTimeout(timer); }
function tick() { if (!playing) return; advance(); if (k < steps.length) timer = setTimeout(tick, 2800); else { playing = false; ui(); } }
function togglePlay() { if (playing) { stop(); ui(); return; } if (k >= steps.length) render(0); playing = true; ui(); timer = setTimeout(tick, 250); }
$('#play').onclick = togglePlay; $('#mPlay').onclick = togglePlay;
$('#mTask').onclick = () => { stop(); render(0); };
$('#mSol').onclick = () => { stop(); render(steps.length); };
$('#mPrev').onclick = () => goStep(k - 1);
$('#mNext').onclick = () => goStep(k + 1);
$('#prevP').onclick = () => stepPage(-1);
$('#nextP').onclick = () => stepPage(1);

function open(i, fromHash) {
  stop(); cur = i;
  const p = P[i];
  seen.add(p.n); store.set('seen', [...seen]);
  $('#pn').textContent = p.n; $('#title').textContent = p.title;
  const sk = $('#skill'); sk.replaceChildren(h('i'), SKILLS[p.skill][0]); sk.style.setProperty('--c', SKILLS[p.skill][1]);
  $('#diff').innerHTML = p.stars ? [1, 2, 3].map(x => x <= p.stars ? STAR : STAR_O).join('') : ''; $('#diff').setAttribute('aria-label', p.stars ? `Qiyinlik ${p.stars} / 3` : '');
  $('#bet').textContent = `${i + 1} / ${P.length}`;
  $('#achips').replaceChildren(...p.answer.split(' · ').map(a => h('span', {}, a)));
  paintNav();
  navItems[i].b.scrollIntoView({ block: 'nearest', inline: 'center' });
  render(Infinity); // opens already solved
  if (!fromHash) { try { history.replaceState(null, '', '#y' + p.n); } catch {} }
}

// keyboard
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault(); const d = e.key === 'ArrowRight' ? 1 : -1;
    if (e.shiftKey) stepPage(d); else goStep(Math.max(0, Math.min(steps.length, k + d)));
  } else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); togglePlay(); }
});
// swipe between pages on touch screens
let sx = null, sy = null;
stage.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') { sx = e.clientX; sy = e.clientY; } });
stage.addEventListener('pointerup', e => { if (sx == null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null; if (Math.abs(dx) > 70 && Math.abs(dy) < 50) stepPage(dx < 0 ? 1 : -1); });
// present mode
function setPresent(on) {
  document.body.classList.toggle('present', on);
  if (on) { try { const r = document.documentElement.requestFullscreen?.(); r && r.catch(() => {}); } catch {} }
  else if (document.fullscreenElement) { try { document.exitFullscreen(); } catch {} }
  window.scrollTo({ top: 0 });
}
$('#present').onclick = () => setPresent(true);
$('#exit').onclick = () => setPresent(false);
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('present')) document.body.classList.remove('present'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('present')) setPresent(false); });

const fromHash = () => { const m = /^#y(\d+)$/.exec(location.hash); return m ? P.findIndex(p => p.n === +m[1]) : -1; };
window.addEventListener('hashchange', () => { const i = fromHash(); if (i >= 0 && i !== cur) open(i, true); });
const i0 = fromHash(); open(i0 >= 0 ? i0 : 0, true);
})();
</script>
